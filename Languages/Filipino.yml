    - find : Loads a custom lua file for the rune system table instead of the default <b>Rune\runeSystem_table.lub</b>. Controls the master rune system configuration data.
      replace : Nilo-load ang isang custom lua file para sa rune system table imbes na ang default na <b>Rune\runeSystem_table.lub</b>. Kinokontrol nito ang pangunahing configuration data ng rune system.


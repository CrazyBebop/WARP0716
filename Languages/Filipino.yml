      replace : Ipinapakita ang AP (Activity Points) bar sa lahat ng job class, hindi lang sa mga 4th job. Sa loob ng client, itinuturing na 4th job ang bawat class para sa AP gauge check. Useful para sa mga server na nagbibigay ng AP sa lahat ng class.

    # RemoveMaxNumbersLimit (title)
    - find : Remove the limit of max number displayed in damage/heal
      replace : Tanggalin ang limit ng max na number na ipinapakita sa damage/heal

    # RemoveMaxNumbersLimit (desc)
    - find : Removes the cap on displayed damage, healing, and other floating numbers. Without this, very large numbers get clamped to a maximum display value. Required for high-rate servers with large damage output.
      replace : Tinatanggal ang cap sa ipinapakitang damage, heal at iba pang floating number. Kung wala ito, napuputol ang napakalaking number sa maximum na display value. Kailangan ito sa mga high-rate server na malalaki ang damage.

    # AllHatEffectsWorldDepthOracle (title)
    - find : All HatEffects Screen-Size World Depth [QJS]
      replace : Screen-Size World Depth ng Lahat ng HatEffect [QJS]

    # AllHatEffectsWorldDepthOracle (desc)
    - find : 2025-07-16 build-specific global HatEffect depth patch, live validated on 2026-07-14. It preserves every original HatEffect STR resource, animation, actor attachment, metadata, teardown, screen-space position, apparent scale, and RHW. During only the two generic HatEffect render methods, vertices at/below actor-anchor Y retain a floor-safe four-quantum contact-biased depth; upper vertices reconstruct Y-up reciprocal depth using projection-matrix +0x10/+0x14 and convert it through 0x00554040. Native world STR NPCs remain unchanged.
      replace : Global na HatEffect depth patch na para lang sa 2025-07-16 build, na-validate nang live noong 2026-07-14. Pinapanatili nito ang bawat orihinal na HatEffect STR resource, animation, actor attachment, metadata, teardown, screen-space position, apparent scale at RHW. Sa loob lang ng dalawang generic na HatEffect render method, ang mga vertex na nasa o nasa ibaba ng actor-anchor Y ay nananatili sa floor-safe na four-quantum contact-biased depth; ang mga vertex sa itaas ay nire-reconstruct ang Y-up reciprocal depth gamit ang projection-matrix +0x10/+0x14 at kino-convert ito sa pamamagitan ng 0x00554040. Walang pagbabago sa mga native world STR NPC.

    # AllowDualWeaponSprites (title)
    - find : Dual-Wield Original Weapon Sprites [QJS]
      replace : Orihinal na Weapon Sprite sa Dual-Wield [QJS]

    # AllowDualWeaponSprites (desc)
    - find : Self-contained QJS/EXE patch; no weapon DLL is required. The D403A0 equipment hook drives the stock single-item loader for each equipped item and installs the original parallel SPR/ACT resources in native weapon slots 5 and 6 instead of generic combined types 25..30. A live-slot renderer bridge direction-preservingly maps blank item ACT actions 88..95 to populated actions 80..87. Off-hand-only equipment also receives its real item pair in slot 6. Applies to every valid item resource without an item-ID allowlist.
      replace : Self-contained na QJS/EXE patch; walang kailangang weapon DLL. Ginagamit ng D403A0 equipment hook ang stock na single-item loader para sa bawat naka-equip na item at inilalagay ang orihinal at magkahiwalay na SPR/ACT resource sa native weapon slot 5 at 6 imbes na sa mga generic na combined type 25..30. May live-slot renderer bridge na nagma-map ng mga blangkong item ACT action 88..95 papunta sa mga action na may laman 80..87, nang hindi nagbabago ang direksyon. Ang equipment na nasa off-hand lang ay nakakatanggap din ng tunay nitong item pair sa slot 6. Gumagana sa bawat valid na item resource nang walang item-ID allowlist.

    # AllowChatWhileBerserk (title)
    - find : Allow Chatting While Berserk
      replace : Payagan ang Pag-chat Habang Berserk

    # AllowChatWhileBerserk (desc)
    - find : "Self-contained QJS/EXE patch. The client helper Status_IsBerserkActive (0x00D8E6C0) scans the local status-icon list for EFST_BERSERK (0x6B) and returns 1 while Berserk is up; every chat-channel handler in CModeMgr::SendMsg drops the outgoing CZ_REQUEST_CHAT (opcode 0xF3) on that 1, so the input clears but nothing is sent. Emotes use another command and stay usable. This forces the helper to always return 0, unblocking chat on every channel while Berserk without touching the item/skill Berserk restrictions. NOTE: removes ONLY the client gate; any server-side chat gate for SC_BERSERK must also be removed for chat to go through."
      replace : "Self-contained na QJS/EXE patch. Ang client helper na Status_IsBerserkActive (0x00D8E6C0) ay nag-i-scan sa local status-icon list para sa EFST_BERSERK (0x6B) at nagre-return ng 1 habang naka-Berserk; bawat chat-channel handler sa CModeMgr::SendMsg ay hindi na itinutuloy ang palabas na CZ_REQUEST_CHAT (opcode 0xF3) kapag 1 ito, kaya nabubura ang input pero walang naipapadala. Ibang command ang gamit ng mga emote kaya magagamit pa rin ang mga ito. Pinipilit ng patch na ito ang helper na laging mag-return ng 0, kaya gagana ang chat sa bawat channel habang naka-Berserk nang hindi ginagalaw ang mga item/skill na restriction ng Berserk. PAALALA: ang client gate LANG ang tinatanggal; kailangan ding tanggalin ang anumang server-side na chat gate para sa SC_BERSERK para makalusot ang chat."

    # RestoreSkillAttackAnimation (title)
    - find : Restore Skill Attack Animation
      replace : Ibalik ang Skill Attack Animation

    # RestoreSkillAttackAnimation (desc)
    - find : "Gives Sonic Blow and Arrow Vulcan back the attacker's sprite animation -- pick either one or both. Gravity never removed the animations themselves, only the routing that selected them: the client still plays it for Chain Crush Combo, and this sends the chosen skills back through the same path. Sound and effects were never affected."
      replace : "Ibinabalik sa Sonic Blow at Arrow Vulcan ang sprite animation ng umaatake -- pumili ng isa o pareho. Hindi kailanman tinanggal ng Gravity ang mismong mga animation, ang routing lang na pumipili sa mga ito: ipinapalabas pa rin ito ng client para sa Chain Crush Combo, at ibinabalik ng patch na ito ang mga napiling skill sa parehong daan. Hindi kailanman naapektuhan ang sound at mga effect."

    # CustomSkills (group title)
    - find : SKILL CUSTOMIZATIONS
      replace : MGA CUSTOMIZATION NG SKILL


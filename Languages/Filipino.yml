##===========================================================#
## All translations (including UI, Patches, Extensions etc.) #
##===========================================================#

translations:

    #========================#
    #             UI         #
    #========================#
    - find : Settings
      replace : Mga Setting

    - find : Title
      replace : Pamagat

    - find : Group
      replace : Grupo

    - find : Author
      replace : May-akda

    - find : Description
      replace : Paglalarawan

    - find : Selected
      replace : Napili

    - find : Tooltip
      replace : Tooltip

    - find : FileName
      replace : Pangalan ng File

    - find : Inbuilt
      replace : Built-in

    - find : From Scripts
      replace : Mula sa Scripts

    - find : Refresh
      replace : I-refresh

    - find : Session
      replace : Session

    - find : Find
      replace : Hanapin

    - find : Sort
      replace : Ayusin

    - find : by
      replace : ayon sa

    - find : None
      replace : Wala

    - find : Options
      replace : Mga Opsyon

    - find : Actions
      replace : Mga Aksyon

    - find : Enter the target file path
      replace : Ilagay ang path ng target file

    - find : Target File
      replace : Target File


    # ===== Character.yml =====

    # CustomChar (group title)
    - find : CHARACTER CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG CHARACTER

    # OfficialPal (title)
    - find : Use official cloth palettes
      replace : Gamitin ang official na cloth palette

    # OfficialPal (desc)
    - find : Forces the client to use Gravity's official cloth color palettes on all langtypes. <b>WARNING:</b> Incompatible with the 'Enable Custom Jobs' patch.
      replace : Pinipilit ang client na gamitin ang official na cloth color palette ng Gravity sa lahat ng langtype. <b>BABALA:</b> Hindi compatible sa 'Enable Custom Jobs' na patch.

    # NoGMSprite (title)
    - find : Disable GM sprite
      replace : I-disable ang GM sprite

    # NoGMSprite (desc)
    - find : Hides the special GM sprite (the yellow character) while keeping all GM functionality intact, including the yellow name color and admin right-click menu. GMs appear as their normal job class.
      replace : Itinatago ang espesyal na GM sprite (ang dilaw na character) pero buo pa rin ang lahat ng GM functionality, kasama ang dilaw na kulay ng pangalan at ang admin right-click menu. Lalabas ang mga GM bilang normal nilang job class.

    # RestoreGMWeaponTrail (title)
    - find : Restore GM weapon trails
      replace : Ibalik ang GM weapon trail

    # RestoreGMWeaponTrail (desc)
    - find : Gives back the weapon-trail sprites (the blade gleam drawn while attacking) to accounts listed under &lt;admin&gt; in clientinfo. The client stores 0 in that layer for GM accounts, leaving it without its sprite, so the renderer drops it entirely. <b>Disable GM sprite</b> only covers the two name-list functions and leaves these call sites untouched, so it is required here and gets selected automatically. Bug reported by Monsii.
      replace : Ibinabalik ang mga weapon-trail sprite (ang kislap ng blade habang umaatake) sa mga account na nakalista sa &lt;admin&gt; sa clientinfo. Naglalagay ang client ng 0 sa layer na iyon para sa mga GM account, kaya wala itong sprite at tuluyan itong hindi dina-draw ng renderer. Ang <b>Disable GM sprite</b> ay sumasakop lang sa dalawang name-list function at hindi ginagalaw ang mga call site na ito, kaya kailangan ito rito at awtomatiko itong napipili. Bug na ini-report ni Monsii.

    # ShowBGEmblem (title)
    - find : Enable Emblem hover for BG [Experimental]
      replace : I-enable ang Emblem hover sa BG [Experimental]

    # ShowBGEmblem (desc)
    - find : Displays guild emblems above characters in Battleground maps, the same way they appear during Guild vs Guild (WoE). Helps identify team members in BG. Experimental -- may have visual quirks.
      replace : Ipinapakita ang guild emblem sa ibabaw ng mga character sa mga Battleground map, gaya ng paglabas nito tuwing Guild vs Guild (WoE). Nakakatulong para makilala ang mga kakampi sa BG. Experimental -- puwedeng may kaunting visual glitch.

    # RestoreModelCulling (title)
    - find : Restore model culling
      replace : Ibalik ang model culling

    # RestoreModelCulling (desc)
    - find : Makes 3D models (buildings, walls, objects) that block your view of the player character turn transparent. Improves visibility in areas with large obstructing models.
      replace : Ginagawang transparent ang mga 3D model (gusali, pader, object) na humaharang sa view mo ng iyong character. Mas malinaw ang view sa mga lugar na may malalaking model na nakaharang.

    # Intravision (title)
    - find : Always see hidden/cloaked objects
      replace : Laging makita ang mga hidden/cloaked na object

    # Intravision (desc)
    - find : Makes hidden and cloaked characters/objects always visible as dark silhouettes, as if the player permanently has the Intravision buff. Useful for GMs or testing -- gives an unfair advantage in PvP.
      replace : Laging nakikita ang mga hidden at cloaked na character/object bilang madilim na silhouette, na parang laging may Intravision buff ang player. Useful para sa mga GM o testing -- nagbibigay ito ng hindi patas na advantage sa PvP.

    # CustomQSDelay (title)
    - find : Customize Quick Switch delay
      replace : I-customize ang Quick Switch delay

    # CustomQSDelay (desc)
    - find : Changes the cooldown delay (in ticks) for the quick equipment swap feature. Lower values allow faster gear switching; higher values enforce a longer wait between swaps.
      replace : Binabago ang cooldown delay (sa ticks) ng quick equipment swap feature. Kapag mas mababa ang value, mas mabilis ang pagpalit ng gear; kapag mas mataas, mas matagal ang hintay sa pagitan ng bawat swap.

    # AllowPL2Leave (title)
    - find : Allow party leader to leave
      replace : Payagang umalis ang party leader

    # AllowPL2Leave (desc)
    - find : Allows the party leader to leave the party when no other members are on the same map. By default, the client prevents the leader from leaving while the party still exists. On rAthena, a leader who leaves disbands the party.
      replace : Pinapayagan ang party leader na umalis sa party kapag walang ibang member sa parehong map. Sa default, hindi pinapaalis ng client ang leader habang may party pa. Sa rAthena, nabubuwag ang party kapag umalis ang leader.

    # AllowSkillSpam (title)
    - find : Allow spam skills by hotkey
      replace : Payagan ang pag-spam ng skill gamit ang hotkey

    # AllowSkillSpam (desc)
    - find : Allows rapid skill casting by holding down a hotkey instead of having to press it repeatedly. Removes the client-side cooldown between hotkey activations. Optionally switched on and off in game with a slash command (default /skillspam, starts off).
      replace : Pinapayagan ang mabilis na pag-cast ng skill sa pamamagitan ng pag-hold ng hotkey imbes na paulit-ulit itong pindutin. Tinatanggal ang client-side cooldown sa pagitan ng bawat pindot ng hotkey. Puwede rin itong i-on at i-off sa loob ng game gamit ang isang slash command (default /skillspam, naka-off sa simula).

    # AllowGuildInClan (title)
    - find : Allow guild activities in clan
      replace : Payagan ang guild activities habang nasa clan

    # AllowGuildInClan (desc)
    - find : Removes the client-side restriction that blocks guild features (creating/joining guilds, GvG, etc.) while the player is a member of a clan. Allows both memberships to coexist.
      replace : Tinatanggal ang client-side na restriction na humaharang sa mga guild feature (paggawa/pagsali sa guild, GvG, atbp.) habang member ng clan ang player. Puwede nang maging member ng dalawa nang sabay.

    # CustomAFStopDelay (title)
    - find : Customize auto follow stop delay
      replace : I-customize ang stop delay ng auto follow

    # CustomAFStopDelay (desc)
    - find : Changes the delay before auto-follow stops after the target moves out of range. Lower values make the character stop sooner; higher values keep following longer.
      replace : Binabago ang delay bago huminto ang auto-follow kapag lumabas sa range ang target. Kapag mas mababa ang value, mas maagang hihinto ang character; kapag mas mataas, mas matagal itong susunod.

    # ShowGvGDamage (title)
    - find : Show Damage for GvG
      replace : Ipakita ang Damage sa GvG

    # ShowGvGDamage (desc)
    - find : Shows damage numbers on Guild vs Guild (WoE) maps. By default, the client hides all damage digits during GvG to reduce visual clutter, but this makes it hard to gauge effectiveness.
      replace : Ipinapakita ang damage numbers sa mga Guild vs Guild (WoE) map. Sa default, itinatago ng client ang lahat ng damage number habang GvG para mabawasan ang kalat sa screen, pero mahirap tuloy malaman kung gaano ka-epektibo ang atake.

    # Allow65kHairs (title)
    - find : Allow 65k Hair Styles
      replace : Payagan ang 65k na Hair Style

    # Allow65kHairs (desc)
    - find : Removes the hard-coded hair style limit, allowing the client to load any hair sprite by number. Supports up to 65535 styles.
      replace : Tinatanggal ang hard-coded na limit ng hair style, kaya kayang i-load ng client ang kahit anong hair sprite ayon sa number nito. Hanggang 65535 na style ang supported.

    # MoreBodyStyles (title)
    - find : More Body Styles (alternate outfits)
      replace : Mas Maraming Body Style (alternate outfit)

    # MoreBodyStyles (desc)
    - find : Lets a job have more alternate outfits than the one the client knows. List each extra outfit as outfit id = job id, costume; its sprites load from costume_<N>. The server must know the outfit id (job enum, script constant, AlternateOutfits, and on rAthena a Jobs entry of its own in job_stats, or @bodystyle answers Appearance changed and nothing changes). Stock outfits are unchanged.
      replace : Pinapayagan ang isang job na magkaroon ng mas maraming alternate outfit kaysa sa iisang alam ng client. Ilista ang bawat dagdag na outfit bilang outfit id = job id, costume; ang mga sprite nito ay nilo-load mula sa costume_<N>. Dapat alam ng server ang outfit id (job enum, script constant, AlternateOutfits, at sa rAthena, sariling Jobs entry sa job_stats; kung wala, sasagot ang @bodystyle ng Appearance changed pero walang magbabago). Walang nagbabago sa mga stock outfit.

    # CustomAutoFollow (group title)
    - find : AUTO FOLLOW CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG AUTO FOLLOW

    # NoAutoFollow (title)
    - find : Disable auto follow
      replace : I-disable ang auto follow

    # NoAutoFollow (desc)
    - find : Completely disables the Shift+Right-Click auto-follow feature. Use on servers where auto-follow is considered an exploit or is not desired.
      replace : Tuluyang dini-disable ang Shift+Right-Click na auto-follow feature. Gamitin sa mga server kung saan itinuturing na exploit ang auto-follow o ayaw itong payagan.

    # DecrAFDelay (title)
    - find : Decrease auto follow delay
      replace : Bawasan ang auto follow delay

    # DecrAFDelay (desc)
    - find : Reduces the initial delay before auto-follow starts moving after Shift+Right-Click. Lower values make the character begin following sooner.
      replace : Binabawasan ang unang delay bago gumalaw ang auto-follow pagkatapos ng Shift+Right-Click. Kapag mas mababa ang value, mas maagang magsisimulang sumunod ang character.

    # CustomAura (group title)
    - find : AURA CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG AURA

    # CustomAuraSprites (title)
    - find : Customize Aura sprites
      replace : I-customize ang mga Aura sprite

    # CustomAuraSprites (desc)
    - find : Separates aura sprites from warp portal effects by using dedicated files (aurafloat.tga and auraring.bmp in 'data\\texture\\effect'). Prevents high-level character auras from visually interfering with warp portals.
      replace : Hinihiwalay ang mga aura sprite sa mga warp portal effect gamit ang sariling mga file (aurafloat.tga at auraring.bmp sa 'data\\texture\\effect'). Para hindi magulo sa paningin kapag nagsasabay ang aura ng high-level na character at ang warp portal.

    # CustomAuraLimits (title)
    - find : Customize Aura display limits
      replace : I-customize ang display limit ng Aura

    # CustomAuraLimits (desc)
    - find : Customizes which character classes and levels display the standard aura effect. Set minimum levels and allowed job classes for aura visibility to match your server's progression system.
      replace : Kina-customize kung aling character class at level ang nagpapakita ng standard na aura effect. I-set ang minimum level at ang mga job class na puwedeng magkaroon ng aura para tumugma sa progression system ng iyong server.

    # CustomChatColor (group title)
    - find : <font color="#9F00EF">CHA</font><font color="#5F00FF">T CO</font><font color="blue">LOR </font><font color="green">CUS</font><font color="yellow">TOM</font><font color="orange">IZA</font><font color="red">TION</font>
      replace : <font color="#9F00EF">PAG-C</font><font color="#5F00FF">USTOM</font><font color="blue">IZE </font><font color="green">NG K</font><font color="yellow">ULAY </font><font color="orange">NG C</font><font color="red">HAT</font>

    # CustomGMColor (title)
    - find : Customize chat color (GM)
      replace : I-customize ang kulay ng chat (GM)

    # CustomGMColor (desc)

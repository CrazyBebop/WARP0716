      replace : Nilo-load ang isang custom lua file para sa display info ng rune system imbes na ang default na <b>Rune\runesystemInfo.lub</b>. Kinokontrol nito ang mga UI label at description ng rune system.

    # CustomRuneRewardLub (title)
    - find : Customize Rune\runeset_reward lub

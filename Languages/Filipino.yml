    # CustomClientInfo (title)
    - find : Customize ClientInfo file
      replace : I-customize ang ClientInfo file

    # CustomClientInfo (desc)
    - find : Changes the clientinfo XML filename from the default *clientinfo.xml to a custom name. Useful for maintaining multiple server configurations or using a non-standard filename.
      replace : Binabago ang filename ng clientinfo XML mula sa default na *clientinfo.xml papunta sa custom na pangalan. Useful kung marami kang server configuration o gumagamit ng hindi karaniwang filename.

    # AllowHomunSkills (title)
    - find : Unlock all valid skills for homunculus and mercenary AI
      replace : I-unlock ang lahat ng valid na skill para sa homunculus at mercenary AI

    # AllowHomunSkills (desc)
    - find : Removes the client-side restriction on which skills homunculus and mercenary AI can use, allowing all valid skills to be cast. Server-side skill availability still applies.
      replace : Tinatanggal ang client-side na restriction sa kung aling mga skill ang puwedeng gamitin ng homunculus at mercenary AI, kaya puwede nang i-cast ang lahat ng valid na skill. Ang server pa rin ang masusunod kung aling skill ang available.

    # SharedBodyPal (group title)
    - find : SHARED BODY PALETTES
      replace : SHARED NA BODY PALETTE

    # BodyPalMF (title)
    - find : Enable shared body palettes - Male & Female
      replace : I-enable ang shared na body palette - Male at Female

    # BodyPalMF (desc)
    - find : Uses one shared set of cloth/body palettes (body_%s_%d.pal) across all job classes while keeping male and female palettes separate. Greatly reduces the number of palette files needed.
      replace : Gumagamit ng iisang shared na set ng cloth/body palette (body_%s_%d.pal) para sa lahat ng job class, pero hiwalay pa rin ang palette ng male at female. Malaki ang nababawas sa dami ng palette file na kailangan.

    # BodyPalUnisex (title)
    - find : Enable shared body palettes - Unisex
      replace : I-enable ang shared na body palette - Unisex

    # BodyPalUnisex (desc)
    - find : Uses one shared set of cloth/body palettes (body_%d.pal) for all job classes and both genders. The simplest option -- minimizes palette files to just one set.
      replace : Gumagamit ng iisang shared na set ng cloth/body palette (body_%d.pal) para sa lahat ng job class at parehong gender. Ito ang pinakasimpleng option -- isang set na lang ng palette file ang kailangan.

    # SharedHeadPal (group title)
    - find : SHARED HEAD PALETTES
      replace : SHARED NA HEAD PALETTE

    # HeadPalMF (title)
    - find : Enable shared head palettes - Male & Female
      replace : I-enable ang shared na head palette - Male at Female

    # HeadPalMF (desc)
    - find : Uses one shared set of hair palettes (head_%s_%d.pal) across all hairstyles while keeping male and female palettes separate. Reduces the number of hair palette files needed.
      replace : Gumagamit ng iisang shared na set ng hair palette (head_%s_%d.pal) para sa lahat ng hairstyle, pero hiwalay pa rin ang palette ng male at female. Nababawasan ang dami ng hair palette file na kailangan.

    # HeadPalUnisex (title)
    - find : Enable shared head palettes - Unisex
      replace : I-enable ang shared na head palette - Unisex

    # HeadPalUnisex (desc)
    - find : Uses one shared set of hair palettes (head_%d.pal) for all hairstyles and both genders. The simplest option -- minimizes hair palette files to just one set.
      replace : Gumagamit ng iisang shared na set ng hair palette (head_%d.pal) para sa lahat ng hairstyle at parehong gender. Ito ang pinakasimpleng option -- isang set na lang ng hair palette file ang kailangan.

    # SharedDoramPal (group title)
    - find : SHARED PALETTES - DORAM
      replace : SHARED NA PALETTE - DORAM

    # DoramHeadPalShared (title)
    - find : Enable shared head palettes for Doram
      replace : I-enable ang shared na head palette para sa Doram

    # DoramHeadPalShared (desc)
    - find : Applies the shared hair palette naming to the Doram races too, which the human patch ignores entirely -- without it a Doram needs one palette file per hairstyle AND per gender. Files stay in the Doram race folder (doram\hair\head_%d.pal) because Doram sprites do not share the human palette indexing -- pointing them at the human files leaves most of the character black. Follows whichever flavour (MF or Unisex) you enabled for the other races, which is required.
      replace : Ina-apply din sa mga Doram race ang shared na pangalan ng hair palette, na tuluyang hindi pinapansin ng patch para sa human -- kung wala ito, kailangan ng Doram ng isang palette file sa bawat hairstyle AT sa bawat gender. Nananatili ang mga file sa Doram race folder (doram\hair\head_%d.pal) dahil hindi pareho ang palette indexing ng mga Doram sprite at ng human -- kapag itinuro sila sa mga file ng human, halos maging itim ang buong character. Sinusunod nito kung aling flavour (MF o Unisex) ang in-enable mo para sa ibang race, na kailangan talaga.

    # MultiGRFs (group title)
    - find : MULTIPLE GRFS
      replace : MARAMING GRF

    # GRFsFromIni (title)
    - find : Enable Multiple GRFs ( INI )
      replace : I-enable ang Maraming GRF ( INI )

    # GRFsFromIni (desc)
    - find : Allows loading up to 10 GRF files listed in an INI file (DATA.INI) in your client folder. GRFs are loaded in order, with earlier entries taking priority. The standard way to use multiple GRFs on servers.
      replace : Pinapayagan ang pag-load ng hanggang 10 GRF file na nakalista sa isang INI file (DATA.INI) sa iyong client folder. Sunod-sunod na nilo-load ang mga GRF, at mas priority ang mga naunang entry. Ito ang karaniwang paraan ng paggamit ng maraming GRF sa mga server.

    # GRFsEmbedded (title)
    - find : Enable Multiple GRFs ( Embedded )
      replace : I-enable ang Maraming GRF ( Embedded )

    # GRFsEmbedded (desc)
    - find : Embeds GRF filenames directly into the client executable instead of reading from an external INI file. You provide the GRF list at patch time and it gets baked into the exe. No DATA.INI file needed in the client folder.
      replace : Direktang inilalagay ang mga filename ng GRF sa client executable imbes na basahin mula sa isang external na INI file. Ibibigay mo ang listahan ng GRF habang nagpa-patch at isasama na ito sa exe. Hindi na kailangan ng DATA.INI file sa client folder.

    # ===== Env.yml =====

    # CustomEnv (group title)
    - find : ENVIRONMENT CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG ENVIRONMENT

    # HKLMtoHKCU (title)
    - find : HKLM To HKCU
      replace : HKLM papuntang HKCU

    # HKLMtoHKCU (desc)
    - find : Switches registry access from HKEY_LOCAL_MACHINE to HKEY_CURRENT_USER. Allows the client to save settings without admin privileges, which is required on shared or restricted PCs.
      replace : Inililipat ang registry access mula HKEY_LOCAL_MACHINE papunta sa HKEY_CURRENT_USER. Makakapag-save ng settings ang client kahit walang admin privileges, na kailangan sa mga shared o restricted na PC.

    # NoAdminNeeded (title)
    - find : Remove admin privilege requirement
      replace : Tanggalin ang requirement na admin privilege

    # NoAdminNeeded (desc)
    - find : Removes the client's requirement for administrator privileges, so it launches without the UAC elevation prompt. Useful for players who cannot or prefer not to run the game as admin.
      replace : Tinatanggal ang pangangailangan ng client sa administrator privileges, kaya bubukas ito nang walang UAC elevation prompt. Useful para sa mga player na hindi puwede o ayaw patakbuhin ang game bilang admin.

    # LoadClientPlugins (title)
    - find : Always load client plugins [Experimental]
      replace : Laging i-load ang mga client plugin [Experimental]

    # LoadClientPlugins (desc)
    - find : Forces loading of client plugins (3rd party DLLs in the plugins folder) regardless of the client's sound configuration. Normally plugins only load when sound is enabled.
      replace : Pinipilit ang pag-load ng mga client plugin (mga 3rd party DLL sa plugins folder) kahit ano pa ang sound configuration ng client. Karaniwan, naglo-load lang ang mga plugin kapag naka-enable ang sound.

    # NoMultiWindow (title)
    - find : Disable multiple windows
      replace : I-disable ang maraming window

    # NoMultiWindow (desc)
    - find : Prevents launching more than one game client at a time on all langtypes. Blocks multi-clienting by showing an error if a second instance is opened.
      replace : Pinipigilan ang pagbukas ng higit sa isang game client nang sabay sa lahat ng langtype. Hinaharangan ang multi-client sa pamamagitan ng pagpapakita ng error kapag may binuksang pangalawang instance.

    # CustomMinResolution (title)
    - find : Customize minimum screen resolution
      replace : I-customize ang minimum na screen resolution

    # CustomMinResolution (desc)
    - find : Changes the minimum allowed screen resolution from the default 1024x768 to custom values. Useful for supporting smaller resolutions on older hardware or for testing.
      replace : Binabago ang minimum na screen resolution na pinapayagan mula sa default na 1024x768 papunta sa custom na value. Useful para ma-support ang mas maliit na resolution sa lumang hardware o para sa testing.

    # IgnoreDebugger (title)
    - find : Ignore Debugger
      replace : I-ignore ang Debugger

    # IgnoreDebugger (desc)
    - find : Disables the IsDebuggerPresent() anti-debug check, allowing the client to run under a debugger. Intended for development and reverse engineering only -- do not use on production clients distributed to players.
      replace : Dini-disable ang IsDebuggerPresent() na anti-debug check, kaya puwedeng tumakbo ang client sa ilalim ng debugger. Para lang ito sa development at reverse engineering -- huwag gamitin sa mga production client na ipinamimigay sa mga player.

    # DisableIndoorRSW (title)
    - find : Disable indoor RSW lighting
      replace : I-disable ang indoor RSW lighting

    # DisableIndoorRSW (desc)
    - find : Disables the IndoorRswTable.txt lookup that forces fixed camera angles and lighting on indoor maps. Grants free camera rotation indoors, similar to the NoCameraLock patch but specifically targeting RSW-based indoor restrictions.
      replace : Dini-disable ang lookup sa IndoorRswTable.txt na nagpupuwersa ng fixed na camera angle at lighting sa mga indoor map. Malaya nang maiikot ang camera sa loob, kahawig ng NoCameraLock patch pero partikular para sa mga RSW-based na indoor restriction.

    # RemovePremiumService (title)
    - find : Remove Premium Service text
      replace : Tanggalin ang Premium Service text

    # RemovePremiumService (desc)
    - find : Removes the "Premium Service" text from the character selection screen. This text is irrelevant on servers since there is no premium subscription system.
      replace : Tinatanggal ang "Premium Service" na text sa character selection screen. Walang silbi ang text na ito sa mga server dahil walang premium subscription system.

    # WindowFrame (group title)
    - find : WINDOW FRAME CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG WINDOW FRAME

    # EnableSysMenu (title)
    - find : Enable title buttons
      replace : I-enable ang mga title button

    # EnableSysMenu (desc)
    - find : Adds standard Windows title bar buttons (Minimize, Maximize, Close) and the application icon to the game window. Makes the client behave like a normal window instead of a borderless frame.
      replace : Nagdadagdag ng mga standard na Windows title bar button (Minimize, Maximize, Close) at ng application icon sa game window. Kumikilos ang client na parang normal na window imbes na borderless na frame.

    # UseMiniTitle (title)
    - find : Use Miniature title bar
      replace : Gamitin ang Miniature na title bar

    # UseMiniTitle (desc)
    - find : Switches the game window to use a compact/miniature title bar instead of the standard-size one. Saves screen space while still showing window controls.
      replace : Ginagawang compact/miniature ang title bar ng game window imbes na ang standard na laki. Nakakatipid ng space sa screen habang nakikita pa rin ang mga window control.

    # CustomWinTitle (title)
    - find : Customize Window title
      replace : I-customize ang Window title

    # CustomWinTitle (desc)
    - find : Changes the text shown in the game window's title bar to a custom string. Use to display your server name instead of the default "Ragnarok" title.
      replace : Binabago ang text sa title bar ng game window sa custom na string. Gamitin para ipakita ang pangalan ng iyong server imbes na ang default na "Ragnarok" na title.

    # BorderlessFSW (title)
    - find : Enable Borderless full screen
      replace : I-enable ang Borderless full screen

    # BorderlessFSW (desc)
    - find : Enables borderless fullscreen mode -- removes the window frame and borders when the game resolution matches your screen resolution. Provides a seamless fullscreen experience while allowing easy Alt-Tab.
      replace : Ina-enable ang borderless fullscreen mode -- tinatanggal ang window frame at mga border kapag tugma ang resolution ng game sa resolution ng screen mo. Tuloy-tuloy na fullscreen experience pero madali pa ring mag-Alt-Tab.

    # ClientArgs (group title)
    - find : CLIENT ARGUMENTS
      replace : MGA CLIENT ARGUMENT

    # No1and1Arg (title)
    - find : Disable '1*1' arguments
      replace : I-disable ang '1*1' na argument

    # No1and1Arg (desc)
    - find : Removes the requirement for launcher arguments (1rag1, 1sak1, etc.) so the client can be started directly by double-clicking the exe. Without this, the client refuses to launch unless opened through a patcher.
      replace : Tinatanggal ang pangangailangan ng launcher arguments (1rag1, 1sak1, atbp.) para mabuksan ang client nang direkta sa pag-double-click ng exe. Kung wala ito, ayaw bumukas ng client maliban kung binuksan sa pamamagitan ng patcher.

    # EnableIcon (group title)
    - find : ENABLE ICON
      replace : PAG-ENABLE NG ICON

    # RestoreIcon (title)
    - find : Restore Inbuilt App icon
      replace : Ibalik ang Built-in na App icon

    # RestoreIcon (desc)
    - find : Restores the original Ragnarok Online icon embedded in the executable instead of showing the generic Windows application icon. Fixes the missing icon in the taskbar and window title.
      replace : Ibinabalik ang orihinal na Ragnarok Online icon na nasa loob ng executable imbes na ang generic na Windows application icon. Inaayos ang nawawalang icon sa taskbar at sa window title.

    # CustomIcon (title)
    - find : Customize App icon
      replace : I-customize ang App icon

    # CustomIcon (desc)
    - find : Replaces the application icon with a custom .ico file of your choice (any size and bit depth). For Win7 and later, use <b><font color='deepskyblue'>256x256 32-bit along with a 16x16 version</font></b>.<br><br>Older clients have a limit of 3 icon sizes, so you may need to select which resolutions to include.
      replace : Pinapalitan ang application icon ng custom na .ico file na gusto mo (kahit anong size at bit depth). Para sa Win7 pataas, gumamit ng <b><font color='deepskyblue'>256x256 32-bit kasama ang isang 16x16 na version</font></b>.<br><br>May limit na 3 icon size ang mga lumang client, kaya baka kailangan mong piliin kung aling mga resolution ang isasama.

    # AlterPriority (group title)
    - find : PRIORITY ALTERATION
      replace : PAGBABAGO NG PRIORITY

    # Idle2NormalPriority (title)
    - find : Change Priority (Idle to Normal)
      replace : Palitan ang Priority (Idle papuntang Normal)

    # Idle2NormalPriority (desc)
    - find : Raises the thread priority of the game when its window is inactive from Idle to Normal. Prevents the game from slowing down significantly when alt-tabbed or in the background.
      replace : Tinataasan mula Idle papuntang Normal ang thread priority ng game kapag hindi active ang window nito. Para hindi masyadong bumagal ang game kapag naka-alt-tab o nasa background.

    # Normal2HighPriority (title)
    - find : Change Priority (Normal to High)
      replace : Palitan ang Priority (Normal papuntang High)

    # Normal2HighPriority (desc)
    - find : Raises the thread priority of the active game window from Normal to High. Gives the client more CPU time, which can improve performance on systems running many background applications.
      replace : Tinataasan mula Normal papuntang High ang thread priority ng active na game window. Mas maraming CPU time ang nakukuha ng client, kaya puwedeng gumanda ang performance sa mga PC na maraming tumatakbong application sa background.

    # ===== Network.yml =====

    # CustomNW (group title)
    - find : NETWORK CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG NETWORK

    # SendMD5Hash (title)
    - find : Send MD5 hash packet
      replace : Ipadala ang MD5 hash packet

    # SendMD5Hash (desc)
    - find : Makes the client send its own MD5 hash to the server on login for all langtypes. Used for integrity verification to detect modified client executables. Only enable if your server is configured to receive and check this packet.
      replace : Ipinapadala ng client ang sarili nitong MD5 hash sa server tuwing login, sa lahat ng langtype. Ginagamit ito sa integrity verification para mahuli ang mga binagong client executable. I-enable lang kung naka-configure ang iyong server para tumanggap at mag-check ng packet na ito.

    # NoNagle (title)
    - find : Disable nagle algorithm
      replace : I-disable ang nagle algorithm

    # NoNagle (desc)
    - find : Disables TCP Nagle buffering so packets are sent immediately. Reduces input lag and improves responsiveness at the cost of slightly more network traffic. Recommended for most servers.
      replace : Dini-disable ang TCP Nagle buffering para agad maipadala ang mga packet. Nababawasan ang input lag at mas responsive, kapalit ng bahagyang dagdag na network traffic. Recommended para sa karamihan ng server.

    # EnableProxy (title)
    - find : Enable proxy support
      replace : I-enable ang proxy support

    # EnableProxy (desc)
    - find : Ignores the IP addresses sent by the server when transitioning between login, char, and map servers. Keeps the client connecting to the address from clientinfo.xml instead. Required when playing through a proxy, VPN, or when the server reports internal LAN addresses.
      replace : Hindi pinapansin ang mga IP address na ipinapadala ng server kapag lumilipat sa pagitan ng login, char at map server. Sa address mula sa clientinfo.xml pa rin kumokonekta ang client. Kailangan ito kapag naglalaro gamit ang proxy o VPN, o kapag internal na LAN address ang ibinibigay ng server.

    # SendClientFlags (title)
    - find : Send client flags
      replace : Ipadala ang mga client flag

    # SendClientFlags (desc)
    - find : Sends the client's feature flags to the server during login, keeping client and server in sync about which features are supported. Prevents mismatches that can cause missing UI elements or broken functionality.
      replace : Ipinapadala ang mga feature flag ng client sa server habang nagla-login, para magkatugma ang client at server sa kung aling mga feature ang supported. Iniiwasan ang mismatch na puwedeng magdulot ng nawawalang UI element o sirang functionality.

    # CustomEncKeys (group title)
    - find : ENCRYPTION KEY CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG ENCRYPTION KEY

    # CustomFirstKey (title)
    - find : Customize Packet Key (1st)
      replace : I-customize ang Packet Key (1st)

    # CustomFirstKey (desc)
    - find : Sets a custom value for the 1st packet encryption key. Must match the key configured on your server. <b>WARNING:</b> Do not combine with 'Disable Map packet encryption' -- use one approach or the other.
      replace : Sine-set ang custom na value para sa 1st packet encryption key. Dapat tugma ito sa key na naka-configure sa iyong server. <b>BABALA:</b> Huwag isabay sa 'Disable Map packet encryption' -- isa lang sa dalawa ang gamitin.

    # CustomSecondKey (title)
    - find : Customize Packet Key (2nd)
      replace : I-customize ang Packet Key (2nd)

    # CustomSecondKey (desc)
    - find : Sets a custom value for the 2nd packet encryption key. Must match the key configured on your server. <b>WARNING:</b> Do not combine with 'Disable Map packet encryption' -- use one approach or the other.
      replace : Sine-set ang custom na value para sa 2nd packet encryption key. Dapat tugma ito sa key na naka-configure sa iyong server. <b>BABALA:</b> Huwag isabay sa 'Disable Map packet encryption' -- isa lang sa dalawa ang gamitin.

    # CustomThirdKey (title)
    - find : Customize Packet Key (3rd)
      replace : I-customize ang Packet Key (3rd)

    # CustomThirdKey (desc)
    - find : Sets a custom value for the 3rd packet encryption key. Must match the key configured on your server. <b>WARNING:</b> Do not combine with 'Disable Map packet encryption' -- use one approach or the other.
      replace : Sine-set ang custom na value para sa 3rd packet encryption key. Dapat tugma ito sa key na naka-configure sa iyong server. <b>BABALA:</b> Huwag isabay sa 'Disable Map packet encryption' -- isa lang sa dalawa ang gamitin.

    # DisableEncr (group title)
    - find : DISABLE ENCRYPTION
      replace : PAG-DISABLE NG ENCRYPTION

    # NoPacketEncr (title)
    - find : Disable Map packet encryption
      replace : I-disable ang Map packet encryption

    # NoPacketEncr (desc)
    - find : Disables packet obfuscation (encryption) for communication with the map server. Simplifies packet handling on servers that do not use encryption.<br> Also known as 'Skip Packet Obfuscation'.
      replace : Dini-disable ang packet obfuscation (encryption) sa komunikasyon sa map server. Mas simple ang packet handling sa mga server na hindi gumagamit ng encryption.<br> Kilala rin bilang 'Skip Packet Obfuscation'.

    # NoEncrForLC (title)

    # PlayFirstFrameSounds (desc)
    - find : "The client never plays a sound event placed on frame 0 of an animation that has just REPLACED another one. On an action change it rewinds its \"last sounded frame\" cursor to 0 and then plays the frames after it, so frame 0 is skipped. Looping animations and actions replayed as-is are unaffected -- which is why hurt and attack sounds are already heard from the second blow onwards, only the first one missing. Death animations always follow another action and are never replayed, so their frame-0 sound is never heard at all: over the 2103 monster sprites of a 2025 kRO data.grf that is 47 silent death sounds, among them Doppelganger and the twelve Bio Lab clones, Baphomet, Osiris, Thanatos, Pupa, Orc Warrior, Obeaune and Elder Willow. This patch rewinds the cursor to -1 instead, so the loop starts at frame 0 and those sounds are heard. (Warning: doppleganger_die.wav is a bit annoying :D)"
      replace : "Hindi kailanman pinapatugtog ng client ang sound event na nasa frame 0 ng animation na kapapalit lang sa iba. Kapag nagpalit ng action, ibinabalik nito sa 0 ang \"last sounded frame\" cursor at saka pinapatugtog ang mga frame pagkatapos nito, kaya nalalaktawan ang frame 0. Hindi apektado ang mga looping animation at mga action na inuulit nang buo -- kaya naririnig na ang hurt at attack sound mula sa ikalawang tama, at ang una lang ang nawawala. Laging sumusunod ang mga death animation sa ibang action at hindi kailanman inuulit, kaya hindi kailanman naririnig ang frame-0 sound nila: sa 2103 monster sprite ng isang 2025 kRO data.grf, 47 death sound ang tahimik, kasama ang Doppelganger at ang labindalawang Bio Lab clone, Baphomet, Osiris, Thanatos, Pupa, Orc Warrior, Obeaune at Elder Willow. Ibinabalik ng patch na ito ang cursor sa -1 sa halip, kaya nagsisimula ang loop sa frame 0 at naririnig na ang mga sound na iyon. (Babala: medyo nakakainis ang doppleganger_die.wav :D)"


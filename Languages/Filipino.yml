    # CustomWalkDelay (desc)
    - find : "Sets the delay between walk-click inputs, in milliseconds. The client default is 600, and lower values make movement more responsive. <b>Do not go below 10.</b> At very low values the character walks onto an NPC's cell while its message box or shop window is open (GitHub issue #39); 10 is the lowest value confirmed working. 0 is still accepted and reproduces the old separate <i>Remove Walk Delay</i> patch exactly, including that bug. This patch replaces both <i>Remove Walk Delay</i> and <i>Customize Walk Delay</i>, which were the same setting: removing the delay was simply this value set to 0."
      replace : "Sine-set ang delay sa pagitan ng bawat walk-click, sa milliseconds. 600 ang default ng client, at kapag mas mababa ang value, mas responsive ang paggalaw. <b>Huwag bababa sa 10.</b> Sa sobrang babang value, naglalakad ang character papunta sa cell ng NPC habang bukas ang message box o shop window nito (GitHub issue #39); 10 ang pinakamababang value na kumpirmadong gumagana. Tinatanggap pa rin ang 0 at eksaktong ginagaya nito ang dating hiwalay na <i>Remove Walk Delay</i> patch, kasama ang bug na iyon. Pinapalitan ng patch na ito ang <i>Remove Walk Delay</i> at ang <i>Customize Walk Delay</i>, na iisang setting lang pala: ang pagtanggal ng delay ay ang value na ito na naka-set sa 0."


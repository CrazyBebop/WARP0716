      replace : Nilo-load ang isang custom lua file para sa rune information imbes na ang default na <b>Rune\rune_info.lub</b>. Kinokontrol nito ang mga stat at property ng rune na ipinapakita sa UI.

    # CustomRuneSetInfoLub (title)
    - find : Customize Rune\runeset_info lub

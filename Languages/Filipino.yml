    # UseSSOLogin (desc)
    - find : Forces all langtypes to use the SSO login packet (0x825) instead of the old login packet (0x64). Required when using a patcher/launcher that passes credentials via command-line token. <b>WARNING:</b> Incompatible with 'Disable Login password encryption' (NoPassEncr).
      replace : Pinipilit ang lahat ng langtype na gamitin ang SSO login packet (0x825) imbes na ang lumang login packet (0x64). Kailangan ito kapag gumagamit ng patcher/launcher na nagpapasa ng credentials sa pamamagitan ng command-line token. <b>BABALA:</b> Hindi compatible sa 'Disable Login password encryption' (NoPassEncr).

    # UseOldLogin (title)
    - find : Use Old Login Packet
      replace : Gamitin ang Lumang Login Packet

    # UseOldLogin (desc)
    - find : Forces the client to use the old login packet (0x64) for authentication. Required for newer clients where 'Restore Login Window' no longer works. The standard choice for most servers with direct username/password login.
      replace : Pinipilit ang client na gamitin ang lumang login packet (0x64) para sa authentication. Kailangan ito sa mga mas bagong client kung saan hindi na gumagana ang 'Restore Login Window'. Ito ang karaniwang pinipili ng karamihan ng server na may direktang username/password login.

    # ChatRepeat (group title)
    - find : CHAT REPEAT
      replace : PAG-ULIT NG CHAT

    # UnlimitedChatRepeat (title)
    - find : Allow unlimited chat repeat
      replace : Payagan ang walang limit na pag-ulit ng chat

    # UnlimitedChatRepeat (desc)
    - find : Removes the client-side limit on repeating the same chat message. By default, the client blocks you from sending the same message more than a few times in a row.
      replace : Tinatanggal ang client-side na limit sa pag-ulit ng parehong chat message. Sa default, hinaharangan ka ng client kapag ilang beses mo nang sunod-sunod na sinend ang parehong message.

    # LimitedChatRepeat (title)
    - find : Customize chat repeat limit
      replace : I-customize ang limit ng pag-ulit ng chat

    # LimitedChatRepeat (desc)
    - find : Changes the maximum number of identical consecutive chat messages allowed from the default of 2 to a custom value. Provides more control than fully removing the limit.
      replace : Binabago ang maximum na bilang ng magkakaparehong sunod-sunod na chat message na pinapayagan, mula sa default na 2 papunta sa custom na value. Mas kontrolado ito kaysa sa tuluyang pagtanggal ng limit.

    # CustomSleep (group title)
    - find : SLEEP DELAY CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG SLEEP DELAY

    # AddInpDelay (title)
    - find : Add Input Delay
      replace : Magdagdag ng Input Delay

    # AddInpDelay (desc)
    - find : Adds extra milliseconds to the client's input processing delay. Can be used to throttle input speed for testing or to reduce CPU usage on low-end machines.
      replace : Nagdadagdag ng ilang milliseconds sa input processing delay ng client. Puwedeng gamitin para pabagalin ang input para sa testing o para bawasan ang CPU usage sa mga low-end na PC.

    # CustomGameLoopDelay (title)
    - find : Customize game loop delay
      replace : I-customize ang game loop delay

    # CustomGameLoopDelay (desc)
    - find : Changes the Sleep() delay in the main game loop to a custom value (in milliseconds). Lower values make the client more responsive but use more CPU; higher values save CPU at the cost of smoothness.
      replace : Binabago ang Sleep() delay sa main game loop sa custom na value (sa milliseconds). Kapag mas mababa ang value, mas responsive ang client pero mas malakas sa CPU; kapag mas mataas, tipid sa CPU pero hindi gaanong smooth.

    # ===== Data.yml =====

    # CustomData (group title)
    - find : DATA CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG DATA

    # CustomMaxEmbFileSize (title)
    - find : Customize Max Emblem file size
      replace : I-customize ang Max na file size ng Emblem

    # CustomMaxEmbFileSize (desc)
    - find : Changes the maximum allowed file size for guild emblems. Increase this if players are getting errors when uploading detailed or high-resolution guild emblems.
      replace : Binabago ang maximum na file size na pinapayagan para sa guild emblem. Taasan ito kung nagkaka-error ang mga player kapag nag-a-upload ng detalyado o high-resolution na guild emblem.

    # CustomRodexTax (title)
    - find : Customize Rodex tax
      replace : I-customize ang Rodex tax

    # CustomRodexTax (desc)
    - find : Changes the tax percentage deducted when sending zeny through the RoDEx (mail) system. Set to 0 to remove the tax entirely, or adjust to your server's economy.
      replace : Binabago ang tax percentage na kinakaltas kapag nagpapadala ng zeny sa RoDEx (mail) system. I-set sa 0 para tuluyang tanggalin ang tax, o i-adjust ayon sa economy ng iyong server.

    # CustomGuildExpLimit (title)
    - find : Customize guild exp limit
      replace : I-customize ang guild exp limit

    # CustomGuildExpLimit (desc)
    - find : Changes the maximum percentage of experience a player can donate to their guild. Default is 50%. Adjust to match your server's guild configuration.
      replace : Binabago ang maximum na percentage ng experience na puwedeng i-donate ng player sa kanyang guild. Ang default ay 50%. I-adjust para tumugma sa guild configuration ng iyong server.

    # CustomAdvAgencyLimits (title)
    - find : Customize adventurer agency levels
      replace : I-customize ang mga level ng adventurer agency

    # CustomAdvAgencyLimits (desc)
    - find : Changes the minimum and maximum level range shown in the Adventurer Agency (party finder) window. Adjust to match your server's level cap and party requirements.
      replace : Binabago ang minimum at maximum na level range na lumalabas sa Adventurer Agency (party finder) window. I-adjust para tumugma sa level cap at party requirements ng iyong server.

    # EnableCustomFonts (title)
    - find : Enable Official Custom Fonts (Reforged)
      replace : I-enable ang Official Custom Fonts (Reforged)

    # EnableCustomFonts (desc)
    - find : Loads custom .ttf fonts via AddFontResourceExA at init, bypassing the broken T2Embed API on modern Windows. Prompts to copy included .ttf fonts to your client folder on first apply. Requires FixFontsCharset (auto-enabled).
      replace : Nilo-load ang mga custom na .ttf font gamit ang AddFontResourceExA sa init, para malampasan ang sirang T2Embed API sa modernong Windows. Sa unang apply, tatanungin ka kung kokopyahin ang mga kasamang .ttf font sa client folder mo. Kailangan ang FixFontsCharset (awtomatikong naka-enable).

    # FixFontsCharset (title)
    - find : Fix charset for Fonts
      replace : Ayusin ang charset ng mga Font

    # FixFontsCharset (desc)
    - find : Fixes the character encoding (charset) used for official custom fonts (EOT and OTF) so they render correctly on all langtypes. Prevents garbled text when using custom fonts on non-Korean service types. Fixed EDI register clobber for 07-16.
      replace : Inaayos ang character encoding (charset) na ginagamit ng official custom font (EOT at OTF) para tama ang render nito sa lahat ng langtype. Iniiwasan ang magulong text kapag gumagamit ng custom font sa mga hindi Korean na service type. Naayos na ang EDI register clobber para sa 07-16.

    # AlwaysAscii (title)
    - find : Use Ascii on All
      replace : Gamitin ang Ascii sa Lahat

    # AlwaysAscii (desc)
    - find : Forces ASCII text rendering regardless of the selected font or langtype. Ensures English characters always display correctly on all service types.
      replace : Pinipilit ang ASCII text rendering kahit ano pa ang napiling font o langtype. Sinisiguro na laging tama ang pagpapakita ng mga English character sa lahat ng service type.

    # CustomSSQuality (title)
    - find : Customize screenshot quality
      replace : I-customize ang quality ng screenshot

    # CustomSSQuality (desc)
    - find : Changes the JPEG compression quality for in-game screenshots (0-100). Higher values produce sharper images but larger files. Default quality is relatively low.
      replace : Binabago ang JPEG compression quality ng mga in-game screenshot (0-100). Kapag mas mataas ang value, mas malinaw ang image pero mas malaki ang file. Medyo mababa ang default na quality.

    # CallKoreaClientInfo (title)
    - find : Always call SelectKoreaClientInfo()
      replace : Laging tawagin ang SelectKoreaClientInfo()

    # CallKoreaClientInfo (desc)
    - find : Ensures SelectKoreaClientInfo() is always called alongside SelectClientInfo(), unlocking features normally restricted to the Korean service type. Recommended for most servers to enable full client functionality.
      replace : Sinisiguro na laging tinatawag ang SelectKoreaClientInfo() kasabay ng SelectClientInfo(), para ma-unlock ang mga feature na karaniwang para lang sa Korean service type. Recommended para sa karamihan ng server para gumana ang buong functionality ng client.

    # DataFolderFirst (title)
    - find : Read data folder first
      replace : Basahin muna ang data folder

    # DataFolderFirst (desc)
    - find : Loads loose files from the 'data' folder before checking GRF archives. Useful for development and testing custom sprites, textures, or lua files without repacking the GRF.
      replace : Nilo-load muna ang mga loose file mula sa 'data' folder bago tingnan ang mga GRF archive. Useful para sa development at pag-test ng mga custom sprite, texture o lua file nang hindi nire-repack ang GRF.

    # PlainTextDesc (title)
    - find : Use plain text descriptions
      replace : Gamitin ang plain text na description

    # PlainTextDesc (desc)
    - find : Forces the client to read item and skill description .txt files as plain ASCII text instead of encoded Korean. Required for English-language description files to display correctly.
      replace : Pinipilit ang client na basahin ang mga item at skill description .txt file bilang plain ASCII text imbes na encoded na Korean. Kailangan ito para tama ang pagpapakita ng mga English na description file.

    # LoadKrExtSettings (title)
    - find : Always load korea ExternalSettings lua file
      replace : Laging i-load ang korea ExternalSettings lua file

    # LoadKrExtSettings (desc)
    - find : Forces loading of the Korean ExternalSettings lua file on all langtypes. This file controls many client features and UI options that are otherwise unavailable outside the Korean service type.
      replace : Pinipilit na i-load ang Korean ExternalSettings lua file sa lahat ng langtype. Kinokontrol ng file na ito ang maraming client feature at UI option na wala sa labas ng Korean service type kung hindi ito naka-load.

    # IncrViewID (title)
    - find : Increase headgear viewID limit
      replace : Taasan ang viewID limit ng headgear

    # IncrViewID (desc)
    - find : Raises the maximum headgear View ID limit from the default (1000-3000 depending on client version) up to 32000. Required for servers with large numbers of custom headgear sprites.
      replace : Tinataasan ang maximum na View ID limit ng headgear mula sa default (1000-3000 depende sa version ng client) hanggang 32000. Kailangan ito sa mga server na may napakaraming custom headgear sprite.

    # No3DBoneLimit (title)
    - find : Remove 3D bones limit
      replace : Tanggalin ang limit ng 3D bones

    # No3DBoneLimit (desc)
    - find : Removes the hardcoded monster ID limit for 3D Granny models, allowing custom 3D monsters beyond the official range. Required for servers that add new 3D monster sprites.
      replace : Tinatanggal ang hardcoded na monster ID limit para sa mga 3D Granny model, kaya puwede ang mga custom 3D monster na lampas sa official na range. Kailangan ito sa mga server na nagdadagdag ng bagong 3D monster sprite.

    # IncrMapQuality (title)
    - find : Increase map quality
      replace : Taasan ang quality ng map

    # IncrMapQuality (desc)
    - find : Upgrades map texture rendering from 16-bit to 32-bit color depth, resulting in smoother color gradients and reduced banding on ground textures. May slightly increase memory usage.
      replace : Ina-upgrade ang map texture rendering mula 16-bit papunta sa 32-bit na color depth, kaya mas smooth ang color gradient at mas kaunti ang banding sa mga ground texture. Puwedeng bahagyang tumaas ang memory usage.

    # EnableEffectTool (title)
    - find : Enable effect for all maps
      replace : I-enable ang effect sa lahat ng map

    # EnableEffectTool (desc)
    - find : Makes the client load per-map effect files from the EffectTool folder on all maps, not just select ones. Allows custom map effects (weather, ambient particles, etc.) to work everywhere.
      replace : Ipinapa-load sa client ang mga per-map effect file mula sa EffectTool folder sa lahat ng map, hindi lang sa iilan. Gagana kahit saan ang mga custom map effect (weather, ambient particles, atbp.).

    # ItemInfoPerServer (title)
    - find : Load iteminfo based on char server
      replace : I-load ang iteminfo ayon sa char server

    # ItemInfoPerServer (desc)
    - find : Loads the ItemInfo lua file and passes the selected character server name as an argument. Allows different item databases per server when hosting multiple char servers (e.g., Renewal vs Pre-Renewal).
      replace : Nilo-load ang ItemInfo lua file at ipinapasa ang pangalan ng napiling character server bilang argument. Puwedeng magkaiba ang item database ng bawat server kapag maraming char server (hal. Renewal vs Pre-Renewal).

    # UseStateLubIcon (title)
    - find : Use icons from stateiconimginfo.lub
      replace : Gamitin ang mga icon mula sa stateiconimginfo.lub

    # UseStateLubIcon (desc)
    - find : Disables hardcoded status effect icons and loads them exclusively from stateiconimginfo.lub instead. Allows full customization of buff/debuff icons through lua.
      replace : Dini-disable ang mga hardcoded na status effect icon at sa stateiconimginfo.lub na lang ito nilo-load. Puwede nang i-customize nang buo ang mga buff/debuff icon sa lua.

    # CustomDLL (title)
    - find : Add custom DLLs
      replace : Magdagdag ng mga custom DLL

    # CustomDLL (desc)
    - find : Injects custom DLL loading into the client at startup. Specify the DLL filename and exported functions to call. Used for adding custom functionality like anticheat, custom rendering, or server-specific features.
      replace : Nagdadagdag ng pag-load ng custom DLL sa client sa startup. Ilagay ang filename ng DLL at ang mga exported function na tatawagin. Ginagamit para magdagdag ng custom functionality gaya ng anticheat, custom rendering o mga feature na para lang sa iyong server.

    # HideBuildInfo (title)
    - find : Hide build info
      replace : Itago ang build info

    # HideBuildInfo (desc)
    - find : Hides the client's build date, time, and version information by zeroing out all related strings. Prevents players from seeing which exact client version the server uses.
      replace : Itinatago ang build date, oras at version info ng client sa pamamagitan ng pag-zero sa lahat ng kaugnay na string. Hindi makikita ng mga player kung anong eksaktong client version ang gamit ng server.

    # NoCameraLock (title)
    - find : Disable camera lock
      replace : I-disable ang camera lock

    # NoCameraLock (desc)
    - find : Disables the per-map camera lock defined in ViewPointTable.txt, allowing free camera rotation on all maps. Useful for players who prefer manual camera control indoors and in dungeons.
      replace : Dini-disable ang per-map na camera lock na naka-define sa ViewPointTable.txt, kaya malayang maiikot ang camera sa lahat ng map. Useful para sa mga player na mas gusto ang manual na camera control sa mga indoor map at sa mga dungeon.

    # NoMapInfo (title)
    - find : Disable map signs
      replace : I-disable ang mga map sign

    # NoMapInfo (desc)
    - find : Disables the map name signs (location banners) that appear when entering a new map, controlled by mapInfo.lub. Removes visual clutter for players who find them distracting.
      replace : Dini-disable ang mga map name sign (location banner) na lumalabas kapag pumapasok sa bagong map, na kinokontrol ng mapInfo.lub. Nababawasan ang kalat sa screen para sa mga player na nadi-distract dito.

    # FixArrowsCharset (title)
    - find : Translate arrows to English
      replace : I-translate sa English ang mga arrow

    # FixArrowsCharset (desc)
    - find : Translates the arrow symbols and menu button labels in the hotkey settings UI from Korean to English. Fixes unreadable Korean text in the shortcut key configuration window.
      replace : Tina-translate mula Korean papuntang English ang mga arrow symbol at label ng menu button sa hotkey settings UI. Inaayos ang hindi mabasang Korean text sa shortcut key configuration window.

    # BossDropIdentified (title)
    - find : Use 'identified' drops for Boss (MVP) mob
      replace : Gamitin ang 'identified' na drop para sa Boss (MVP) mob

    # BossDropIdentified (desc)
    - find : Forces items dropped by Boss (MVP) monsters to show their identified names in the drop announcement, so players can see exactly what dropped instead of 'Unknown Item'.
      replace : Pinipilit na identified na pangalan ang ipakita sa drop announcement ng mga item na na-drop ng Boss (MVP) monster, para makita ng mga player kung ano talaga ang nag-drop imbes na 'Unknown Item'.

    # TranslateClient (title)
    - find : Translate client
      replace : I-translate ang client

    # TranslateClient (desc)
    - find : Replaces hardcoded Korean text strings in the client with translations from a mapping file (defaults to <b>Translations_EN.yml</b>). Covers system messages, UI labels, and other text that cannot be changed through lua or txt files.
      replace : Pinapalitan ang mga hardcoded na Korean text string sa client ng mga translation mula sa isang mapping file (default ay <b>Translations_EN.yml</b>). Sakop nito ang mga system message, UI label at iba pang text na hindi mapapalitan sa lua o txt file.

    # CustomCaptchaDecomp (title)
    - find : Customize Captcha Decomp size
      replace : I-customize ang Captcha Decomp size

    # CustomCaptchaDecomp (desc)
    - find : Changes the maximum zlib decompression buffer size for captcha images. Increase this if captcha images fail to load due to exceeding the default size limit.
      replace : Binabago ang maximum na zlib decompression buffer size para sa mga captcha image. Taasan ito kung hindi nalo-load ang mga captcha image dahil lumalampas sa default na size limit.

    # RestoreCpsDll (title)
    - find : Restore Cps Dll
      replace : Ibalik ang Cps Dll

    # RestoreCpsDll (desc)
    - find : Restores the loading of Cps.dll (Gravity's protection DLL) which was removed in newer clients. Only enable if your server requires this DLL. <b>WARNING:</b> Requires the 'Add custom DLLs' patch to be active; may crash without it.
      replace : Ibinabalik ang pag-load ng Cps.dll (ang protection DLL ng Gravity) na tinanggal sa mga mas bagong client. I-enable lang kung kailangan ng iyong server ang DLL na ito. <b>BABALA:</b> Kailangang naka-active ang 'Add custom DLLs' na patch; puwedeng mag-crash kung wala ito.

    # DisableProtect (group title)
    - find : DISABLE PROTECTION
      replace : PAG-DISABLE NG PROTECTION

    # NoGGuard (title)
    - find : Disable Game Guard
      replace : I-disable ang Game Guard

    # NoGGuard (desc)
    - find : Disables nProtect GameGuard, Gravity's anti-cheat system built into Renewal clients. Required for servers since GameGuard expects Gravity's official servers and will block connections otherwise.
      replace : Dini-disable ang nProtect GameGuard, ang anti-cheat system ng Gravity na kasama sa mga Renewal client. Kailangan ito sa mga server dahil official server ng Gravity ang hinahanap ng GameGuard at haharangin nito ang connection kung hindi.

    # SkipLub (group title)
    - find : SKIP LUB
      replace : LAKTAWAN ANG LUB

    # SkipSignBoard (title)
    - find : Skip SignBoard lubs
      replace : Laktawan ang mga SignBoard lub

    # SkipSignBoard (desc)
    - find : Skips loading of SignBoardList lub files. Useful if you do not use sign board features or want to avoid errors from missing files.
      replace : Nilalaktawan ang pag-load ng mga SignBoardList lub file. Useful kung hindi mo ginagamit ang sign board feature o gusto mong iwasan ang error dahil sa kulang na file.

    # SkipTownInfo (title)
    - find : Skip Towninfo lub
      replace : Laktawan ang Towninfo lub

    # SkipTownInfo (desc)
    - find : Skips loading of Towninfo.lub file. Use this if you handle town information through other means or want to avoid errors from a missing file.
      replace : Nilalaktawan ang pag-load ng Towninfo.lub file. Gamitin ito kung sa ibang paraan mo hinahawakan ang town information o gusto mong iwasan ang error dahil sa nawawalang file.

    # CustomPath (group title)
    - find : PATH CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG PATH

    # CustomDefaultBGM (title)
    - find : Customize Default BGM file
      replace : I-customize ang Default BGM file

    # CustomDefaultBGM (desc)
    - find : Changes the default background music played on the login screen from <b>bgm\01.mp3</b> to a custom MP3 file of your choice.
      replace : Binabago ang default na background music sa login screen mula <b>bgm\01.mp3</b> papunta sa custom na MP3 file na gusto mo.

    # CustomItemInfoLub (title)
    - find : Customize Iteminfo lub
      replace : I-customize ang Iteminfo lub

    # CustomItemInfoLub (desc)
    - find : Loads a custom lua file for item data instead of the default <b>Iteminfo*.lub</b>. Lets you use a renamed or restructured item database file.
      replace : Nilo-load ang isang custom lua file para sa item data imbes na ang default na <b>Iteminfo*.lub</b>. Puwede kang gumamit ng item database file na pinalitan ang pangalan o binago ang structure.

    # CustomAchieveLub (title)
    - find : Customize AchievementList lub
      replace : I-customize ang AchievementList lub

    # CustomAchieveLub (desc)
    - find : Loads a custom lua file for achievement data instead of the default <b>AchievementList*.lub</b>. Useful for servers with custom achievement systems.
      replace : Nilo-load ang isang custom lua file para sa achievement data imbes na ang default na <b>AchievementList*.lub</b>. Useful para sa mga server na may custom achievement system.

    # CustomMonSizeEffLub (title)
    - find : Customize MonsterSizeEffect lub
      replace : I-customize ang MonsterSizeEffect lub

    # CustomMonSizeEffLub (desc)
    - find : Loads a custom lua file for monster size effects instead of the default <b>MonsterSizeEffect*.lub</b>. Controls which monsters display enlarged or reduced sprites.
      replace : Nilo-load ang isang custom lua file para sa monster size effect imbes na ang default na <b>MonsterSizeEffect*.lub</b>. Kinokontrol nito kung aling mga monster ang may pinalaki o pinaliit na sprite.

    # CustomTownInfoLub (title)
    - find : Customize Towninfo lub
      replace : I-customize ang Towninfo lub

    # CustomTownInfoLub (desc)
    - find : Loads a custom lua file for town/city data instead of the default <b>Towninfo*.lub</b>. Controls warp portal labels and town information displayed on the world map.
      replace : Nilo-load ang isang custom lua file para sa town/city data imbes na ang default na <b>Towninfo*.lub</b>. Kinokontrol nito ang mga label ng warp portal at ang town information na nasa world map.

    # CustomPetEvoClnLub (title)
    - find : Customize PetEvolutionCln lub
      replace : I-customize ang PetEvolutionCln lub

    # CustomPetEvoClnLub (desc)
    - find : Loads a custom lua file for pet evolution data instead of the default <b>PetEvolutionCln*.lub</b>. Use when adding custom pet evolution paths.
      replace : Nilo-load ang isang custom lua file para sa pet evolution data imbes na ang default na <b>PetEvolutionCln*.lub</b>. Gamitin kapag nagdadagdag ng custom na pet evolution path.

    # CustomTipboxLub (title)
    - find : Customize Tipbox lub
      replace : I-customize ang Tipbox lub

    # CustomTipboxLub (desc)
    - find : Loads a custom lua file for the Tip Box (loading screen tips) instead of the default <b>Tipbox*.lub</b>. Allows custom loading tips for your server.
      replace : Nilo-load ang isang custom lua file para sa Tip Box (mga tip sa loading screen) imbes na ang default na <b>Tipbox*.lub</b>. Puwede kang maglagay ng sariling loading tip para sa iyong server.

    # CustomCheckAttLub (title)
    - find : Customize CheckAttendance lub
      replace : I-customize ang CheckAttendance lub

    # CustomCheckAttLub (desc)
    - find : Loads a custom lua file for the attendance check-in system instead of the default <b>CheckAttendance*.lub</b>. Use when customizing daily login reward data.
      replace : Nilo-load ang isang custom lua file para sa attendance check-in system imbes na ang default na <b>CheckAttendance*.lub</b>. Gamitin kapag kina-customize ang data ng daily login reward.

    # CustomPrivAirplaneLub (title)
    - find : Customize PrivateAirplane lub
      replace : I-customize ang PrivateAirplane lub

    # CustomPrivAirplaneLub (desc)
    - find : Loads a custom lua file for the Private Airship system instead of the default <b>PrivateAirplane*.lub</b>. Use when customizing airship destinations or teleport data.
      replace : Nilo-load ang isang custom lua file para sa Private Airship system imbes na ang default na <b>PrivateAirplane*.lub</b>. Gamitin kapag kina-customize ang mga destination ng airship o ang teleport data.

    # CustomMapInfoLub (title)
    - find : Customize MapInfo lub
      replace : I-customize ang MapInfo lub

    # CustomMapInfoLub (desc)
    - find : Loads a custom lua file for map information instead of the default <b>MapInfo*.lub</b>. Controls map name banners and location data shown when entering maps.
      replace : Nilo-load ang isang custom lua file para sa map information imbes na ang default na <b>MapInfo*.lub</b>. Kinokontrol nito ang mga map name banner at location data na lumalabas kapag pumapasok sa map.

    # CustomOngQuestInfoLub (title)
    - find : Customize OngoingQuestInfoList lub
      replace : I-customize ang OngoingQuestInfoList lub

    # CustomOngQuestInfoLub (desc)
    - find : Loads a custom lua file for ongoing quest information instead of the default <b>OngoingQuestInfoList*.lub</b>. Use when customizing the quest tracker display.
      replace : Nilo-load ang isang custom lua file para sa ongoing quest information imbes na ang default na <b>OngoingQuestInfoList*.lub</b>. Gamitin kapag kina-customize ang display ng quest tracker.

    # CustomRcmdQuestInfoLub (title)
    - find : Customize RecommendedQuestInfoList lub
      replace : I-customize ang RecommendedQuestInfoList lub

    # CustomRcmdQuestInfoLub (desc)
    - find : Loads a custom lua file for recommended quest data instead of the default <b>RecommendedQuestInfoList*.lub</b>. Use when customizing suggested quests shown to players.
      replace : Nilo-load ang isang custom lua file para sa recommended quest data imbes na ang default na <b>RecommendedQuestInfoList*.lub</b>. Gamitin kapag kina-customize ang mga suggested quest na ipinapakita sa mga player.

    # CustomspopupLub (title)
    - find : Customize spopup lub
      replace : I-customize ang spopup lub

    # CustomspopupLub (desc)
    - find : Loads a custom lua file for skill popup data instead of the default <b>spopup.lub</b>. Controls the popup text shown when hovering over skills.
      replace : Nilo-load ang isang custom lua file para sa skill popup data imbes na ang default na <b>spopup.lub</b>. Kinokontrol nito ang popup text na lumalabas kapag itinapat ang cursor sa isang skill.

    # CustomChangeMatLub (title)
    - find : Customize ChangeMaterial lub
      replace : I-customize ang ChangeMaterial lub

    # CustomChangeMatLub (desc)
    - find : Loads a custom lua file for material change data instead of the default <b>ChangeMaterial.lub</b>. Controls the material/ingredient lists shown in crafting UIs.
      replace : Nilo-load ang isang custom lua file para sa material change data imbes na ang default na <b>ChangeMaterial.lub</b>. Kinokontrol nito ang mga listahan ng material/ingredient sa mga crafting UI.

    # CustomQuestQualiLub (title)
    - find : Customize QuestClassificationInfo lub
      replace : I-customize ang QuestClassificationInfo lub

    # CustomQuestQualiLub (desc)

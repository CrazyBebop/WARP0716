    - find : Displays Matk as a range using the tilde <b>(~)</b> symbol (e.g., 100~150) instead of using the plus <b>(+)</b> sign (e.g., 100+50) in the Stats Window. Matches the display style many players are familiar with.
      replace : Ipinapakita ang Matk bilang range gamit ang tilde <b>(~)</b> na symbol (hal. 100~150) imbes na ang plus <b>(+)</b> na sign (hal. 100+50) sa Stats Window. Tugma ito sa display style na nakasanayan ng maraming player.


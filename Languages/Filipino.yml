    - find : Disables password encryption in the old login packet (0x64) for langtypes 4 and 7. Required for servers using plaintext or bcrypt password authentication with these langtypes. <b>WARNING:</b> Conflicts with 'Use SSO Login Packet' -- do not enable both.
      replace : Dini-disable ang password encryption sa lumang login packet (0x64) para sa langtype 4 at 7. Kailangan ito sa mga server na gumagamit ng plaintext o bcrypt na password authentication sa mga langtype na ito. <b>BABALA:</b> Nagko-conflict sa 'Use SSO Login Packet' -- huwag i-enable ang dalawa nang sabay.


      replace : Ina-enable ang mga custom na uri ng homunculus na lampas sa official na set gamit ang mga lua file. Ginagamit nito ang parehong <b>'ReqJobName'</b> function ng custom jobs, kaya walang ibang configuration file na kailangan bukod sa job lua.


    - find : Loads a custom lua file for rune set information instead of the default <b>Rune\runeset_info.lub</b>. Controls rune set data and bonuses shown in the UI.
      replace : Nilo-load ang isang custom lua file para sa rune set information imbes na ang default na <b>Rune\runeset_info.lub</b>. Kinokontrol nito ang rune set data at mga bonus na ipinapakita sa UI.

    # CustomRuneSystemTableLub (title)
    - find : Customize Rune\runeSystem_table lub
      replace : I-customize ang Rune\runeSystem_table lub


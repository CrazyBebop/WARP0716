      replace : Nilalagyan ng mga page ang hair picker sa character creation para makapag-alok ng higit sa 23 na built-in na style. Max 128. Kailangan ng isang thumbnail sa bawat dagdag na style sa <b>data\texture\&lt;UI&gt;\make_character_ver2\</b> (01 hanggang 23 lang ang kasama sa kRO). Ipares sa <i>Allow 65k Hair Styles</i>.

    # HairColorGuard (title)
    - find : Hair colour guard, and extra hair colours
      replace : Hair colour guard, at dagdag na hair colour

    # HairColorGuard (desc)
    - find : Ignores a hair colour in character creation when that style ships no matching <b>.pal</b> file. Without this the client shows a <i>Cannot find File</i> palette error and then <b>crashes</b> with an access violation, because it dereferences the palette it failed to load. Only affects hair colour in the creation window; nothing else is suppressed.<br><br>It also repaints the swatch row when a style change forces the colour back to <b>none</b>, so the lit swatch stops disagreeing with the character.<br><br>Then it asks <b>how many hair colours</b> the picker should offer. <b>9</b> is the client default and changes no layout at all. Above 9 the row keeps its size and gains a <b>tenth cell that pages to the next nine</b>, the way the hair style grid does; it wraps round to the first page at the end. The buttons move to a relocated array because a tenth would otherwise land on the gender button. Each added colour needs its own <b>.pal</b> files, or the guard above will refuse it, and its own <b>color&lt;NN&gt;_off/_over/_on.bmp</b> art under <b>data\texture\...\make_character_ver2\</b>, or the swatch falls back to the first face. Your server's <b>max hair colour</b> has to allow the range too.
      replace : Hindi pinapansin ang isang hair colour sa character creation kapag walang katugmang <b>.pal</b> file ang style na iyon. Kung wala ito, magpapakita ang client ng <i>Cannot find File</i> na palette error at saka <b>nagka-crash</b> dahil sa access violation, dahil ginagamit nito ang palette na hindi nito na-load. Hair colour lang sa creation window ang apektado; wala nang ibang pinipigilan.<br><br>Pinipintura rin nitong muli ang swatch row kapag ibinalik ng pagpalit ng style ang kulay sa <b>none</b>, para hindi na magkasalungat ang naka-highlight na swatch at ang character.<br><br>Pagkatapos, itatanong nito <b>kung ilang hair colour</b> ang iaalok ng picker. <b>9</b> ang default ng client at walang binabago sa layout. Kapag lampas sa 9, pareho pa rin ang laki ng row pero magkakaroon ito ng <b>ika-sampung cell na lilipat sa susunod na siyam</b>, gaya ng hair style grid; babalik ito sa unang page pagdating sa dulo. Inililipat ang mga button sa isang bagong array dahil kung hindi, mapupunta ang ika-sampu sa gender button. Kailangan ng bawat dagdag na kulay ang sarili nitong mga <b>.pal</b> file, kung hindi ay tatanggihan ito ng guard sa itaas, at ang sarili nitong <b>color&lt;NN&gt;_off/_over/_on.bmp</b> na art sa <b>data\texture\...\make_character_ver2\</b>, kung hindi ay babalik ang swatch sa unang itsura. Dapat ding payagan ng <b>max hair colour</b> ng iyong server ang range na iyon.


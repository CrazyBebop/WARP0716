      replace : Ina-enable ang mga custom player skill na lampas sa official na skill list sa pamamagitan ng pag-load ng definition mula sa mga lua file. Kailangan ito sa mga server na nagdadagdag ng bagong skill. Experimental -- puwedeng kailanganin ng maingat na lua configuration.

    # CustomHomunSkills (title)
    - find : Enable Custom Homunculus skills [Experimental]
      replace : I-enable ang mga Custom Homunculus skill [Experimental]

    # CustomHomunSkills (desc)
    - find : Enables custom homunculus skills beyond the official list by loading definitions from lua files. Required for servers that add new homunculus abilities. Experimental.
      replace : Ina-enable ang mga custom homunculus skill na lampas sa official na listahan sa pamamagitan ng pag-load ng definition mula sa mga lua file. Kailangan ito sa mga server na nagdadagdag ng bagong ability ng homunculus. Experimental.


      replace : Pinipilit na ipakita ang official na login background image ng Gravity sa lahat ng langtype. Kung wala ito, blangko o ibang background ang lumalabas sa ilang langtype.

    # NoHourly (title)
    - find : Remove Hourly announcement
      replace : Tanggalin ang Hourly announcement


      replace : Ibinabalik ang mga napiling button sa ilalim ng HP/SP bar sa Basic Info Window (new UI style). Nakalista ang <b>bawat</b> button ng client na ito; kapag pumili ka ng nakikita na, walang mangyayari. Gamitin ito para ibalik ang mga button na itinatago ng client sa default, na sa 2025-07-16 ay ang <b>Battleground, Booking at Twitter</b>. Huwag piliin ang parehong button dito at sa <i>Hide Buttons (New UI)</i> - tatanggihan iyon at may lalabas na error na nagsasabi kung aling button.


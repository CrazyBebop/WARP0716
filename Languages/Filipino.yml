    - find : In progress and experimental (still in beta), more are added with each update. Adds kRO 2026's quality-of-life changes, translated from kRO's own 2026 client. When you apply it, you choose which ones to add (all by default).
      replace : Ginagawa pa at experimental (beta pa), at may nadadagdag sa bawat update. Idinadagdag ang mga quality-of-life na pagbabago ng kRO 2026, na kinuha mula sa mismong 2026 client ng kRO. Pagka-apply mo, pipiliin mo kung alin ang idadagdag (lahat, sa default).


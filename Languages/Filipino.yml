    # TighterClickArea (desc)
    - find : The client widens every entity's clickable rectangle (hitbox) up to a minimum computed from the window width -- <b>width / 640 x 40</b> pixels for actors, <b>x 34</b> for map NPCs and skill units, so 100 and 85 px at 1600x900. A small sprite therefore defends a box far larger than itself, so neighbouring entities overlap and fight over the same click, and the frontmost rectangle wins whoever owns it. This patch divides all three minimums by 2, 4, 8 or 16 while keeping the scaling with the window width. It cannot shrink a big sprite's rectangle, which comes from its artwork.
      replace : Pinalalapad ng client ang clickable na rectangle (hitbox) ng bawat entity hanggang sa isang minimum na kinukuwenta mula sa lapad ng window -- <b>width / 640 x 40</b> pixels para sa mga actor, <b>x 34</b> para sa mga map NPC at skill unit, kaya 100 at 85 px sa 1600x900. Dahil dito, ang maliit na sprite ay may box na mas malaki pa kaysa sa sarili nito, nagsasapawan ang mga magkakatabing entity at nag-aagawan sa parehong click, at ang pinakaharap na rectangle ang nananalo kahit kanino pa ito. Hinahati ng patch na ito ang tatlong minimum sa 2, 4, 8 o 16 habang sumusunod pa rin sa lapad ng window. Hindi nito kayang paliitin ang rectangle ng malaking sprite, dahil galing iyon sa artwork nito.


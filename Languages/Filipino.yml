      replace : Kapag kailangan ng client restart ang isang setting (resolution, window mode, Render Scaling) at pinindot mo ang OK, kusang magbubukas ulit ang client gamit ang parehong mga argument, imbes na buksan ang restart web address mula sa msgstringtable (sa official site ito itinuturo ng kRO, at sa GitHub page naman ng ROenglishRE).


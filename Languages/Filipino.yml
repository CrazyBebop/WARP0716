      replace : Itinuturo sa client na ito ang Druid line ng Gravity (Druid, Karnos, Alitea, ang kanilang mga riding form at ang mga Werewolf/Wereraptor form) gaya ng pagkakakilala rito ng mga 2026 kRO client, direkta mula sa data.grf nang walang Lua job file. Kailangan ng server na may mga job na ito at ng data.grf na may art nila. Kasama na sa English translation ng WARPGATE ang limang skill file nito, kaya kung iyon ang gamit ng client mo, piliin ang Hindi (No) kapag inalok ng patch ang sarili nitong mga kopya.


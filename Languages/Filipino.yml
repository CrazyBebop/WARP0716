    - find : Removes the hourly popup announcements about game rating and play time reminders. These are Korean regulatory requirements that are irrelevant on servers.
      replace : Tinatanggal ang mga popup announcement bawat oras tungkol sa game rating at paalala sa oras ng paglalaro. Requirement ito ng regulasyon sa Korea at walang silbi sa mga server.

    # EnableFlagEmotes (title)
    - find : Enable flag emoticons
      replace : I-enable ang mga flag emoticon


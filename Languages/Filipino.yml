      replace : Tatanungin ka kung ilang <b>percent lampas sa default ng client</b> ang dagdag, at iko-convert ito para sa iyo, kaya kapag nag-type ka ng <b>60</b>, 60% ang dagdag na range ng camera (480 &rarr; 768). Ang mga preset sa itaas ang mga karaniwang value; sakop naman nito ang lahat ng nasa pagitan. <b>134</b> ang default, bahagyang mas mababa sa Max. Itim ang lumalabas sa mga gilid ng screen kapag lampas sa 135, pero pinapayagan pa rin ito rito para makapag-experiment ka. &#9733; <b>Huwag kalimutang gamitin ang /zoom sa loob ng game</b>, kung hindi ay wala kang makikitang epekto. May sariling zoom-out setting ang client, at kapag naka-off iyon, naka-cap ang camera sa 400, na mas masikip pa kaysa sa stock.


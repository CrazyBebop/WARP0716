      replace : Dini-disable ang client-side na chat filter na nagse-censor sa mga salitang nakalista sa <b>manner.txt</b>. Normal nang lalabas sa chat ang mga na-filter na salita imbes na mapalitan ng asterisk.

    # SkipServiceSelect (title)
    - find : Skip service selection screen
      replace : Laktawan ang service selection screen


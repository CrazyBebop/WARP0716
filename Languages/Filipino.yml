      replace : Inaayos ang paghawak ng keyboard shortcut kapag pinapatakbo ang client sa Wine (Linux/macOS). Experimental -- puwedeng hindi gumana sa lahat ng version o configuration ng Wine.

    # CustomMissingLauncherMsg (title)
    - find : Customize missing launcher message
      replace : I-customize ang message kapag walang launcher

    # CustomMissingLauncherMsg (desc)
    - find : Customizes the error message shown when the client is launched without a patcher. By default the message is blank -- use this to show a helpful message like "Please use the patcher to start the game."
      replace : Kina-customize ang error message na lumalabas kapag binuksan ang client nang walang patcher. Sa default, blangko ang message -- gamitin ito para magpakita ng nakakatulong na message gaya ng "Pakigamit ang patcher para simulan ang game."

    # TildeForMatk (title)
    - find : Use Tilde for Matk
      replace : Gamitin ang Tilde para sa Matk


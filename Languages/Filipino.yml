      replace : Nilo-load ang mga dagdag na lua override file ni llchrisll na nagpapalawak at nagpa-patch sa mga kasalukuyang lua table at function ng client. Nagdadagdag ng mga quality-of-life improvement at fix. Tingnan ang <a href="https://llchrisll.github.io/ROTPDocs/addons/cls/?h=lua">documentation</a> para sa buong listahan ng mga pagbabago. Experimental.


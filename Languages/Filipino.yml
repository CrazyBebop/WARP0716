    # CustomButtons (desc)
    - find : Adds extra buttons of your own to the row below the HP/SP bars in the Basic Info Window, beyond the 25 the client ships with. Each one is written as <b>iconName = behaves like</b>, where the icon name is also the file name - the client loads <b>bt_&lt;iconName&gt;.bmp</b> and <b>bt_&lt;iconName&gt;_press.bmp</b> from <b>data\texture\&lt;UI folder&gt;\menu_icon\</b> as 32x34 24-bit BMPs with magenta (FF00FF) transparent, so without those files the button draws blank. <b>behaves like</b> names one of the stock buttons and the new one does whatever that one does.
      replace : Nagdadagdag ng sarili mong mga button sa row sa ilalim ng HP/SP bar sa Basic Info Window, bukod sa 25 na kasama na sa client. Isinusulat ang bawat isa bilang <b>iconName = behaves like</b>, kung saan ang icon name ay siya ring file name - nilo-load ng client ang <b>bt_&lt;iconName&gt;.bmp</b> at <b>bt_&lt;iconName&gt;_press.bmp</b> mula sa <b>data\texture\&lt;UI folder&gt;\menu_icon\</b> bilang 32x34 24-bit na BMP na transparent ang magenta (FF00FF), kaya kung wala ang mga file na iyon, blangko ang button. Ang <b>behaves like</b> ay pangalan ng isa sa mga stock button, at gagawin ng bagong button ang anumang ginagawa ng button na iyon.


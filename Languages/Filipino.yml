##===================================#
## Text orientation & other settings #
##===================================#

RTL: no

##============================#
## Tab names for TestBench UI #
##============================#

tabs:
    - Mga Patch
    - Mga Extension
    - Mga Tester
    - Mga Resulta

##========================#
## File/Dir Dialog titles #
##========================#

dialogs:
    dir: Piliin ang folder na may mga test exe
    src: Piliin ang source exe file
    tgt: Piliin ang target exe file
    loadS: Piliin ang session file na ilo-load
    saveS: Piliin kung saan ise-save ang session file

actions:

    #==============#
    # Patches Page #
    #==============#

    getPatches:
        title: Kunin ang<br>mga Patch
        tooltip: Pinupuno ang Patch List ng lahat ng naka-define na patch

    selVisiblePatches:
        title: Piliin ang<br>Nakikita
        tooltip: Piliin ang lahat ng patch na nakikita ngayon

    clearSelPatches:
        title: I-clear ang<br>Napili
        tooltip: I-clear ang lahat ng napiling patch

    #=================#
    # Extensions Page #
    #=================#

    getExtns:
        title: Kunin ang<br>mga Extension
        tooltip: Pinupuno ang Extensions List ng lahat ng naka-define na extension

    selVisibleExtns:
        title: Piliin ang<br>Nakikita
        tooltip: Piliin ang lahat ng extension na nakikita ngayon

    clearSelExtns:
        title: I-clear ang<br>Napili
        tooltip: I-clear ang lahat ng napiling extension

    #==============#
    # Testers Page #
    #==============#

    getExes:
        title: Kunin ang mga Exe
        tooltip: Pinupuno ang Exe List ng lahat ng .exe file na makikita sa Test directory

    selVisibleExes:
        title: Piliin ang<br>Nakikita
        tooltip: Piliin ang lahat ng exe file na nakikita ngayon

    clearSelExes:
        title: I-clear ang<br>Napili
        tooltip: I-clear ang lahat ng napiling exe file

    #==============#
    # Results Page #
    #==============#

    runTest:
        title: Patakbuhin ang Test
        tooltip: Tine-test ang mga napiling patch at extension sa listahan ng mga napiling exe at inilalabas ang resulta sa 'Mga Resulta' na tab

    #=======================#
    # Script Window related #
    #=======================#

    showScriptWin:
        title: Ipakita ang Script Window
        tooltip: Ipinapakita (Alt+W) ang script window na ginagamit para mabilis na i-test ang mga script

    #=========================#
    # Remaining Quick Actions #
    #=========================#

    loadSrcExe:
        title: I-load ang<br>Source
        tooltip: I-load ang source exe file (at ang mga script kung hindi pa naka-load)

    applyPatches:
        title: I-apply ang<br>mga Patch
        tooltip: I-apply ang mga napiling patch sa naka-load na exe at i-save bilang target file

    selectPrev:
        title: Piliin ang<br>Nakaraan
        tooltip: Piliin ang lahat ng patch na in-apply noong huling beses

    selectRcmd:
        title: Piliin ang<br>Recommended
        tooltip: Piliin ang lahat ng patch na naka-mark na 'recommended'

    loadChangedScripts:
        title: I-load ang<br>mga Script
        tooltip: I-load/I-reload (Alt+C) ang lahat ng .qjs script file na nabago (mula noong huling pag-load) sa mga sub-folder na 'Patches', 'Support' at 'Extensions' sa loob ng 'Scripts' directory

    clearOutput:
        title: I-clear
        tooltip: I-clear ang 'Output' view

    evalScript:
        title: I-evaluate
        tooltip: I-evaluate (Ctrl+R) ang script sa Editor at ilabas ang resulta sa Output

    clearEditor:
        title: I-clear
        tooltip: I-clear ang script editor

    #================#
    # Filter Options #
    #================#

    rexBtn:
        tooltip: Piliin kung Regular expression O glob style na matching ang gagamitin

    csBtn:
        tooltip: Piliin kung case-sensitive o hindi ang matching

    #============#
    # Menu Items #
    #============#

    loadPatchScripts:
        title: I-load mula sa <b>'Patches'</b>
        tooltip: I-load/I-reload (Alt+P) ang lahat ng .qjs script file sa loob ng 'Scripts/Patches' directory

    loadExtnScripts:
        title: I-load mula sa <b>'Extensions'</b>
        tooltip: I-load/I-reload (Alt+E) ang lahat ng .qjs script file sa loob ng 'Scripts/Extensions' directory

    loadSuppScripts:
        title: I-load mula sa <b>'Support'</b>
        tooltip: I-load/I-reload (Alt+S) ang lahat ng .qjs script file sa loob ng 'Scripts/Support' directory

    loadAllScripts:
        title: I-load ang <b>Lahat</b> ng Script
        tooltip: I-load/I-reload (Alt+A) ang lahat ng .qjs script file sa mga sub-folder na 'Patches', 'Support' at 'Extensions' sa loob ng 'Scripts' directory

    loadSession:
        title: I-load ang Session file
        tooltip: I-load ang mga napiling patch at input mula sa tinukoy na session file

    saveSession:
        title: I-save ang Session file
        tooltip: I-save ang mga napiling patch at input sa tinukoy na session file

    refreshLanguages:
        title: I-refresh ang mga Wika
        tooltip: I-load ang listahan ng mga wika mula sa mga .yml file sa 'Languages' folder

    refreshStyles:
        title: I-refresh ang mga Style
        tooltip: I-load ang listahan ng mga style mula sa mga .yml file sa 'Styles' folder

    loadExtns:
        title: I-load ang mga Extension
        tooltip: Pinupuno ang Extension drawer ng lahat ng naka-define na extension

    pro2Session:
        title: I-convert ang Profile sa Session
        tooltip: Kino-convert ang isang NEMO profile sa session file na magagamit sa WARP

    genSecFile:
        title: Gumawa ng Security File
        tooltip: Gumagawa ng security file na may iba't ibang hash mula sa isang input file (executable man o hindi)

    #=========================#
    # Settings Dialog related #
    #=========================#
    saveResolution:
        title: I-save ang Resolution
        tooltip: Sine-save ang kasalukuyang resolution ng Tester window bilang default

    keepTestInputs:
        title: Panatilihin ang mga test input
        tooltip: Opsyon para panatilihin ang mga dating na-save na input sa bawat susunod na test

    stopAtError:
        title: Huminto kapag may Error
        tooltip: Opsyon para ihinto ang pagpapatakbo ng mga test sa unang error na makita

    saveResolutions:
        title: I-save ang mga Resolution
        tooltip: Sine-save ang kasalukuyang resolution ng Main at Script window bilang default

    showVersion:
        title: Ipakita ang naka-load na version
        tooltip: I-check ito para ipakita ang build version ng naka-load na exe kasama ang petsa

    enableEpi:
        title: I-enable ang EPI
        tooltip: I-enable ang paggawa at pag-load ng mga EPI file kasama ng katugmang exe file. Mag-ingat sa paggamit.

    genTgtSecure:
        title: Gumawa ng <target>.secure.txt
        tooltip: Ina-enable ang paggawa ng security file (.secure.txt) kasama ng na-patch na Target Exe

    genTgtSession:
        title: Gumawa ng session ng target
        tooltip: Ina-enable ang paggawa ng session file (para magamit sa susunod) kasama ng na-patch na Target Exe

    keepInputs:
        title: Panatilihin ang mga session input
        tooltip: Opsyon para panatilihin ang na-save na input habang naglo-load ng session file, imbes na magtanong isa-isa


      replace : Ginagawang pabalik sa service selection screen ang 'Opening' button sa bagong style na login screen. Useful kung kailangang magpalipat-lipat ng mga player sa maraming service na nakalista sa clientinfo.xml.

    # GuildBrackets (title)
    - find : Use normal guild brackets
      replace : Gamitin ang normal na guild bracket

    # GuildBrackets (desc)
    - find : Replaces the Japanese-style guild name brackets used on langtype 0 with standard square brackets [ ]. Prevents display issues with guild names on English clients.
      replace : Pinapalitan ng standard na square bracket [ ] ang Japanese-style na bracket ng guild name na ginagamit sa langtype 0. Iniiwasan ang problema sa pagpapakita ng guild name sa mga English client.

    # FixChatAt (title)
    - find : "@ Bug fix"
      replace : Ayos sa @ Bug

    # FixChatAt (desc)
    - find : Fixes a client bug that prevents typing the @ symbol in the chat window. Essential for servers that use @ as the prefix for GM commands (e.g., @warp, @item).
      replace : Inaayos ang bug sa client na pumipigil sa pag-type ng @ symbol sa chat window. Mahalaga ito sa mga server na gumagamit ng @ bilang prefix ng mga GM command (hal. @warp, @item).

    # PetTalkMarker (title)
    - find : Mark pet chatter in chat
      replace : Markahan ang pet chatter sa chat

    # PetTalkMarker (desc)
    - find : Tags every automated pet line with a marker, so players can tell it apart from something a person typed. Pet chatter carries no sender and the ordinary message type, so a pet named after a player currently reads exactly like that player talking. You choose the text (default <b>pet</b>), the brackets (round, square, angled or none) and whether it goes before or after the pet name -- e.g. <b>Poring (pet) -- I am hungry!</b>. The marker also appears in the speech bubble above the pet.
      replace : Nilalagyan ng marker ang bawat automated na linya ng pet, para malaman ng mga player na hindi ito tinype ng isang tao. Walang sender at ordinaryong message type lang ang pet chatter, kaya sa ngayon, ang pet na kapangalan ng isang player ay mukhang eksaktong iyon mismong player ang nagsasalita. Ikaw ang pipili ng text (default <b>pet</b>), ng bracket (round, square, angled o wala) at kung ilalagay ito bago o pagkatapos ng pangalan ng pet -- hal. <b>Poring (pet) -- Gutom na ako!</b>. Lumalabas din ang marker sa speech bubble sa ibabaw ng pet.


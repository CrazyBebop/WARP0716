    # ===== UI.yml =====

    # CustomUI (group title)
    - find : UI CUSTOMIZATION
      replace : PAG-CUSTOMIZE NG UI

    # LoadGRFOnSlashCmd (title)
    - find : Load GRF via Slash Command
      replace : I-load ang GRF gamit ang Slash Command

    # LoadGRFOnSlashCmd (desc)
    - find : Adds a configurable slash command (default /greyworld) that loads a specified GRF archive at runtime via CFileMgr::AddPak. Typing the command toggles the GRF on/off with chat feedback. The state persists across sessions via the registry. Assets become available on the next map change.
      replace : Nagdadagdag ng slash command na puwedeng i-configure (default /greyworld) na naglo-load ng isang tinukoy na GRF archive habang tumatakbo ang game, gamit ang CFileMgr::AddPak. Kapag tinype ang command, nao-on/off ang GRF at may lalabas na abiso sa chat. Naaalala ang state kahit sa susunod na session dahil naka-save ito sa registry. Magagamit ang mga asset sa susunod na paglipat ng map.

    # NoLookalikeNameWarning (title)
    - find : No bogus "not your guildsman" whisper warning
      replace : Walang maling "not your guildsman" na babala sa whisper

    # NoLookalikeNameWarning (desc)
    - find : Stops the "This character is not your guildsman" and "This name is not registered in your Friend List" lines the client prints on incoming whispers. They are meant to flag impostors who swap a capital I for a lowercase l, but the comparison is far too loose -- it calls two names alike as soon as min(lenA,lenB)-2 characters match by position. A guild with a member named "Test" therefore warns on every whisper from "Gettar". Firing constantly, the warning only teaches players to ignore the one line that would matter. Verified scope -- the comparison helper is used by nothing else in the client, so only those two messages disappear.
      replace : Pinipigilan ang mga linyang "This character is not your guildsman" at "This name is not registered in your Friend List" na ipinapakita ng client sa mga papasok na whisper. Para sana ito mahuli ang mga impostor na nagpapalit ng malaking I sa maliit na l, pero sobrang luwag ng paghahambing -- itinuturing na magkahawig ang dalawang pangalan basta may min(lenA,lenB)-2 na character na tugma ayon sa posisyon. Kaya ang guild na may member na "Test" ay magbababala sa bawat whisper mula kay "Gettar". Dahil palagi itong lumalabas, natututo lang ang mga player na balewalain ang nag-iisang linyang mahalaga sana. Verified ang saklaw -- wala nang ibang gumagamit ng comparison helper sa client, kaya ang dalawang message lang na iyon ang mawawala.

    # AllowShortcutsInWine (title)
    - find : Allow shortcuts in WINE [Experimental]
      replace : Payagan ang mga shortcut sa WINE [Experimental]

    # AllowShortcutsInWine (desc)

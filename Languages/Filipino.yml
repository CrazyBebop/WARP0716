      replace : Ina-unlock ang mga country flag emoticon sa lahat ng langtype. Kailangan ng text file na nagma-map ng mga flag constant sa number 1-9 para matukoy kung aling mga flag ang available.

    # AllowSpaceInGName (title)
    - find : Allow blank space in guild name
      replace : Payagan ang space sa guild name

    # AllowSpaceInGName (desc)
    - find : Allows spaces in guild names when creating a guild with <b>/guild "Spaced Name"</b>. By default, the client blocks space characters in guild names.
      replace : Pinapayagan ang space sa guild name kapag gumagawa ng guild gamit ang <b>/guild "Spaced Name"</b>. Sa default, hinaharangan ng client ang space sa guild name.

    # CustomInventoryLimit (title)
    - find : Custom inventory limit
      replace : Custom na inventory limit

    # CustomInventoryLimit (desc)
    - find : Changes the maximum number of items that can be displayed in the inventory window. Must match the server-side inventory limit (MAX_INVENTORY in rAthena) or items beyond the limit will not appear.
      replace : Binabago ang maximum na bilang ng item na puwedeng ipakita sa inventory window. Dapat tugma ito sa inventory limit sa server side (MAX_INVENTORY sa rAthena), kung hindi ay hindi lalabas ang mga item na lampas sa limit.

    # CustomInventoryExpandingLimit (title)
    - find : Change limit for cash inventory expanding value

##===================================#
## Text orientation & other settings #
##===================================#

RTL: no

##============================#
## Tab names for TestBench UI #
##============================#

tabs:
    - 補丁
    - 擴充套件
    - 測試人員
    - 結果

##========================#
## File/Dir Dialog titles #
##========================#

dialogs:
    dir: 選擇包含測試exe的目錄
    src: 選擇源exe檔案
    tgt: 選擇目標exe檔案
    loadS: 選擇要上傳的會話檔案
    saveS: 選擇要儲存的會話檔案

actions:

    #==============#
    # Patches Page #
    #==============#

    getPatches:
        title: 獲取<br>補丁
        tooltip: 使用所有定義的補丁填充補丁列表

    selVisiblePatches:
        title: 選擇<br>可見
        tooltip: 選擇當前可見的所有補丁

    clearSelPatches:
        title: 清除<br>選擇
        tooltip: 取消選擇所有選定的補丁

    #=================#
    # Extensions Page #
    #=================#

    getExtns:
        title: 獲取<br>擴充套件
        tooltip: 用所有定義的擴充套件填充擴充套件列表

    selVisibleExtns:
        title: 選擇<br>可見
        tooltip: 選擇所有當前可見的擴充套件程式

    clearSelExtns:
        title: 清除<br>選擇
        tooltip: 取消選擇所有選定的擴充套件

    #==============#
    # Testers Page #
    #==============#

    getExes:
        title: 獲取前任
        tooltip: 用測試目錄中找到的所有 .exe 檔案填充 Exes 列表

    selVisibleExes:
        title: 選擇<br>可見
        tooltip: 選擇所有當前可見的exe

    clearSelExes:
        title: 清除<br>選擇
        tooltip: 取消選擇所有選定的exe

    #==============#
    # Results Page #
    #==============#

    runTest:
        title: 執行測試
        tooltip: 測試所選 EXE 列表中的所選補丁和擴充套件，並在“結果”選項卡中顯示結果

    #=======================#
    # Script Window related #
    #=======================#

    showScriptWin:
        title: 顯示指令碼視窗
        tooltip: 顯示（Alt+W）用於快速測試指令碼的指令碼視窗

    #=========================#
    # Remaining Quick Actions #
    #=========================#

    loadSrcExe:
        title: 載入<br>原點
        tooltip: 載入源 exe 檔案（以及指令碼，如果尚未載入）

    applyPatches:
        title: 應用<br>補丁
        tooltip: 將選定的補丁應用到載入的 exe 並將其儲存為目標檔案

    selectPrev:
        title: 選擇<br>上一個
        tooltip: 選擇上次應用的所有補丁

    selectRcmd:
        title: 選擇<br>推薦
        tooltip: 選擇所有標記為“推薦”的補丁

    loadChangedScripts:
        title: 載入<br>指令碼
        tooltip: 載入/重新載入 (Alt+C) 自上次載入到“Scripts”目錄中的“Patches”、“Support”和“Extensions”子資料夾後修改的所有 .qjs 檔案

    clearOutput:
        title: 乾淨
        tooltip: 清除“輸出”檢視

    evalScript:
        title: 評價
        tooltip: 在編輯器中評估 (Ctrl+R) 指令碼並將結果轉儲到輸出

    clearEditor:
        title: 乾淨
        tooltip: 清理指令碼編輯器

    #================#
    # Filter Options #
    #================#

    rexBtn:
        tooltip: 選擇是否使用正規表示式或全域性匹配

    csBtn:
        tooltip: 選擇匹配是否區分大小寫

    #============#
    # Menu Items #
    #============#

    loadPatchScripts:
        title: 從 <b>'補丁'</b> 載入
        tooltip: 載入/重新載入（Alt+P）“Scripts/Patches”目錄中的所有 .qjs 檔案

    loadExtnScripts:
        title: 從 <b>'擴充套件'</b> 載入
        tooltip: 載入/重新載入（Alt+E）“Scripts/Extensions”目錄中的所有 .qjs 檔案

    loadSuppScripts:
        title: 從 <b>'支撐'</b> 載入
        tooltip: 載入/重新載入（Alt+S）“Scripts/Support”目錄中的所有 .qjs 檔案

    loadAllScripts:
        title: 載入 <b>all</b> 指令碼
        tooltip: 載入/重新載入（Alt+A）“Scripts”目錄中“Patches”、“Support”和“Extensions”子資料夾中的所有 .qjs 檔案

    loadSession:
        title: 載入會話檔案
        tooltip: 從指定的會話檔案載入補丁和輸入選擇

    saveSession:
        title: 儲存會話檔案
        tooltip: 將補丁和輸入選擇儲存到指定的會話檔案

    refreshLanguages:
        title: 重新整理語言
        tooltip: 重新載入“Languages”資料夾中 .yml 檔案提供的語言列表

    refreshStyles:
        title: 重新整理樣式
        tooltip: 重新載入“Styles”資料夾中 .yml 檔案提供的樣式列表

    loadExtns:
        title: 負載擴充套件
        tooltip: 用所有定義的擴充套件填充擴充套件抽屜

    pro2Session:
        title: 將配置檔案轉換為會話
        tooltip: 將 NEMO 配置檔案轉換為 WARP 中可用的會話檔案

    genSecFile:
        title: 生成安全檔案
        tooltip: 從輸入檔案（無論是否可執行）生成具有多個雜湊值的安全檔案

    #=========================#
    # Settings Dialog related #
    #=========================#

    saveResolution:
        title: 儲存解析度
        tooltip: 將測試儀視窗的當前解析度儲存為預設值

    keepTestInputs:
        title: 維護測試輸入
        tooltip: 在每次後續測試中保留先前儲存的輸入的選項

    stopAtError:
        title: 出錯時停止
        tooltip: 在發現第一個錯誤時停止執行測試的選項

    saveResolutions:
        title: 儲存決議
        tooltip: 將主視窗和指令碼視窗的當前解析度儲存為預設值

    showVersion:
        title: 顯示上傳的版本
        tooltip: 選中此選項可顯示載入的 exe 的構建版本以及日期

    enableEpi:
        title: 啟用個人防護裝備
        tooltip: 允許生成和載入 EPI 檔案以及相應的 exe。謹慎使用。

    genTgtSecure:
        title: 生成<target>.secure.txt
        tooltip: 啟用安全檔案 (.secure.txt) 以及修補的目標 Exe 的生成

    genTgtSession:
        title: "生成目標會話"
        tooltip: 允許生成會話檔案（供以後使用）以及修補的目標 Exe

    keepInputs:
        title: 維護會話條目
        tooltip: 載入會話檔案時保留儲存的輸入而不是一一詢問的選項


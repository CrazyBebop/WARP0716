    # CustomButtons (desc)
    - find: Adds extra buttons of your own to the row below the HP/SP bars in the Basic Info Window, beyond the 25 the client ships with. Each one is written as <b>iconName = behaves like</b>, where the icon name is also the file name - the client loads <b>bt_&lt;iconName&gt;.bmp</b> and <b>bt_&lt;iconName&gt;_press.bmp</b> from <b>data\texture\&lt;UI folder&gt;\menu_icon\</b> as 32x34 24-bit BMPs with magenta (FF00FF) transparent, so without those files the button draws blank. <b>behaves like</b> names one of the stock buttons and the new one does whatever that one does.
      replace: เพิ่มปุ่มของคุณเองในแถวใต้แถบ HP/SP ในหน้าต่าง Basic Info นอกเหนือจาก 25 ปุ่มที่ติดมากับไคลเอ็นท์ แต่ละปุ่มเขียนในรูปแบบ <b>iconName = behaves like</b> โดยชื่อไอคอนก็คือชื่อไฟล์ด้วย ไคลเอ็นท์จะโหลด <b>bt_&lt;iconName&gt;.bmp</b> และ <b>bt_&lt;iconName&gt;_press.bmp</b> จาก <b>data\texture\&lt;โฟลเดอร์ UI&gt;\menu_icon\</b> เป็นไฟล์ BMP ขนาด 32x34 แบบ 24-bit ที่ใช้สีม่วงแดง (FF00FF) เป็นสีโปร่งใส หากไม่มีไฟล์เหล่านี้ ปุ่มจะแสดงเป็นช่องว่าง ส่วน <b>behaves like</b> คือชื่อของปุ่มดั้งเดิมปุ่มใดปุ่มหนึ่ง และปุ่มใหม่จะทำงานเหมือนกับปุ่มนั้นทุกอย่าง


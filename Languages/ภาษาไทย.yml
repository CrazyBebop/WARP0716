    # TighterClickArea (desc)
    - find: The client widens every entity's clickable rectangle (hitbox) up to a minimum computed from the window width -- <b>width / 640 x 40</b> pixels for actors, <b>x 34</b> for map NPCs and skill units, so 100 and 85 px at 1600x900. A small sprite therefore defends a box far larger than itself, so neighbouring entities overlap and fight over the same click, and the frontmost rectangle wins whoever owns it. This patch divides all three minimums by 2, 4, 8 or 16 while keeping the scaling with the window width. It cannot shrink a big sprite's rectangle, which comes from its artwork.
      replace: ไคลเอ็นท์จะขยายกรอบสี่เหลี่ยมที่คลิกได้ (hitbox) ของทุก entity ให้มีขนาดอย่างน้อยตามค่าที่คำนวณจากความกว้างหน้าต่าง คือ <b>width / 640 x 40</b> พิกเซลสำหรับ actor และ <b>x 34</b> สำหรับ NPC บนแมพและ skill unit ซึ่งเท่ากับ 100 และ 85 px ที่ 1600x900 ดังนั้น sprite ขนาดเล็กจะครอบครองกรอบที่ใหญ่กว่าตัวเองมาก ทำให้ entity ที่อยู่ใกล้กันซ้อนทับและแย่งการคลิกเดียวกัน และกรอบที่อยู่หน้าสุดจะชนะไม่ว่าจะเป็นของใคร แพทช์นี้หารค่าขั้นต่ำทั้งสามด้วย 2, 4, 8 หรือ 16 โดยยังคงการปรับสเกลตามความกว้างหน้าต่างไว้ แพทช์นี้ย่อกรอบของ sprite ขนาดใหญ่ไม่ได้ เพราะกรอบนั้นมาจากภาพของ sprite เอง


    # CustomWalkDelay (title)
    - find: Walk Delay (Reforged)
      replace: ดีเลย์การเดิน (Reforged)

    # CustomWalkDelay (desc)
    - find: "Sets the delay between walk-click inputs, in milliseconds. The client default is 600, and lower values make movement more responsive. <b>Do not go below 10.</b> At very low values the character walks onto an NPC's cell while its message box or shop window is open (GitHub issue #39); 10 is the lowest value confirmed working. 0 is still accepted and reproduces the old separate <i>Remove Walk Delay</i> patch exactly, including that bug. This patch replaces both <i>Remove Walk Delay</i> and <i>Customize Walk Delay</i>, which were the same setting: removing the delay was simply this value set to 0."
      replace: "กำหนดดีเลย์ระหว่างการคลิกเดินแต่ละครั้ง หน่วยเป็นมิลลิวินาที ค่าเริ่มต้นของไคลเอ็นท์คือ 600 และค่าที่ต่ำลงจะทำให้การเคลื่อนที่ตอบสนองไวขึ้น <b>อย่าตั้งต่ำกว่า 10</b> ที่ค่าต่ำมากๆ ตัวละครจะเดินขึ้นไปบนช่องของ NPC ขณะที่กล่องข้อความหรือหน้าต่างร้านค้าของ NPC นั้นยังเปิดอยู่ (GitHub issue #39) ค่า 10 เป็นค่าต่ำสุดที่ยืนยันแล้วว่าใช้งานได้ ค่า 0 ยังใช้ได้และจะทำงานเหมือนแพทช์ <i>Remove Walk Delay</i> แบบแยกตัวเดิมทุกประการ รวมถึงบั๊กนั้นด้วย แพทช์นี้ใช้แทนทั้ง <i>Remove Walk Delay</i> และ <i>Customize Walk Delay</i> ซึ่งจริงๆ แล้วเป็นการตั้งค่าเดียวกัน การลบดีเลย์ก็คือการตั้งค่านี้เป็น 0 นั่นเอง"


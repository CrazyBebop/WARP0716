    # AllowChatWhileBerserk (desc)
    - find: "Self-contained QJS/EXE patch. The client helper Status_IsBerserkActive (0x00D8E6C0) scans the local status-icon list for EFST_BERSERK (0x6B) and returns 1 while Berserk is up; every chat-channel handler in CModeMgr::SendMsg drops the outgoing CZ_REQUEST_CHAT (opcode 0xF3) on that 1, so the input clears but nothing is sent. Emotes use another command and stay usable. This forces the helper to always return 0, unblocking chat on every channel while Berserk without touching the item/skill Berserk restrictions. NOTE: removes ONLY the client gate; any server-side chat gate for SC_BERSERK must also be removed for chat to go through."
      replace: "แพทช์ QJS/EXE ที่ทำงานได้ในตัวเอง ฟังก์ชันช่วยของไคลเอ็นท์ Status_IsBerserkActive (0x00D8E6C0) จะสแกนรายการไอคอนสถานะของตัวละครเพื่อหา EFST_BERSERK (0x6B) และคืนค่า 1 ขณะที่ Berserk ทำงานอยู่ ตัวจัดการช่องแชททุกช่องใน CModeMgr::SendMsg จะทิ้ง CZ_REQUEST_CHAT (opcode 0xF3) ที่กำลังส่งออกเมื่อได้ค่า 1 นั้น ทำให้ช่องพิมพ์ถูกล้างแต่ไม่มีข้อความถูกส่งออกไป อีโมตใช้คำสั่งอื่นจึงยังใช้งานได้ แพทช์นี้บังคับให้ฟังก์ชันช่วยคืนค่า 0 เสมอ ทำให้แชทได้ทุกช่องขณะติด Berserk โดยไม่แตะข้อจำกัด Berserk ของไอเทม/สกิล หมายเหตุ: แพทช์นี้ยกเลิกเฉพาะการกั้นฝั่งไคลเอ็นท์เท่านั้น หากเซิร์ฟเวอร์มีการกั้นแชทสำหรับ SC_BERSERK ด้วย ต้องยกเลิกฝั่งเซิร์ฟเวอร์ด้วย แชทจึงจะส่งออกไปได้"


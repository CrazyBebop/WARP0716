      replace: แบ่งตัวเลือกทรงผมตอนสร้างตัวละครเป็นหน้าๆ เพื่อให้มีทรงผมได้มากกว่า 23 ทรงที่มีมาในตัว สูงสุด 128 ทรง ต้องมีภาพตัวอย่างหนึ่งภาพต่อทรงผมที่เพิ่มขึ้นใน <b>data\texture\&lt;UI&gt;\make_character_ver2\</b> (kRO มีให้เฉพาะ 01 ถึง 23) ใช้คู่กับ <i>Allow 65k Hair Styles</i>


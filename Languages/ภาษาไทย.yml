    # NoLookalikeNameWarning (desc)
    - find: Stops the "This character is not your guildsman" and "This name is not registered in your Friend List" lines the client prints on incoming whispers. They are meant to flag impostors who swap a capital I for a lowercase l, but the comparison is far too loose -- it calls two names alike as soon as min(lenA,lenB)-2 characters match by position. A guild with a member named "Test" therefore warns on every whisper from "Gettar". Firing constantly, the warning only teaches players to ignore the one line that would matter. Verified scope -- the comparison helper is used by nothing else in the client, so only those two messages disappear.
      replace: หยุดข้อความ "This character is not your guildsman" และ "This name is not registered in your Friend List" ที่ไคลเอ็นท์แสดงเมื่อมีข้อความกระซิบเข้ามา ข้อความเหล่านี้มีไว้เตือนผู้แอบอ้างที่สลับตัว I พิมพ์ใหญ่กับตัว l พิมพ์เล็ก แต่การเปรียบเทียบหลวมเกินไปมาก โดยจะถือว่าสองชื่อคล้ายกันทันทีที่มีตัวอักษรตรงตำแหน่งกัน min(lenA,lenB)-2 ตัว ดังนั้นกิลด์ที่มีสมาชิกชื่อ "Test" จะมีคำเตือนทุกครั้งที่ได้รับกระซิบจาก "Gettar" เมื่อเตือนอยู่ตลอดเวลา คำเตือนนี้ก็มีแต่จะสอนให้ผู้เล่นมองข้ามข้อความเดียวที่อาจสำคัญจริงๆ ตรวจสอบขอบเขตแล้ว ฟังก์ชันเปรียบเทียบนี้ไม่ได้ถูกใช้ที่อื่นในไคลเอ็นท์ จึงมีเพียงสองข้อความนี้เท่านั้นที่หายไป


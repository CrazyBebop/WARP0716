      replace: ปิดใช้งาน GM sprite

    # NoGMSprite (desc)
    - find: Hides the special GM sprite (the yellow character) while keeping all GM functionality intact, including the yellow name color and admin right-click menu. GMs appear as their normal job class.
      replace: ซ่อน GM sprite แบบพิเศษ (ตัวละครสีเหลือง) โดยที่ฟังก์ชันของ GM ทั้งหมดยังใช้งานได้ตามเดิม รวมถึงชื่อสีเหลืองและเมนูคลิกขวาของแอดมิน GM จะแสดงเป็นอาชีพปกติของตัวเอง


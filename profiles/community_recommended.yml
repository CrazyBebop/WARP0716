# Community Recommended Profile - 2025-07-16 Client
#
# All recommend:yes patches from the WARP patch definitions.
# This is the minimal set to get a working English client.
#
# Usage:
#   1. Place your unpacked 2025-07-16 exe in the Inputs/ folder
#   2. Update the 'from' path below to match your exe filename
#   3. Run: win32/WARP_console.exe -using profiles/community_recommended.yml
#   4. Your patched exe will be in Outputs/

#
# 2026-08-08 - four patches removed after a live audit. Each was verified, not assumed; the full
# derivation is in warp0716/docs/PATCH_HISTORY.md under that date.
#
#   NoHardCodedAddr  its declaration is commented out in Patches/Network.yml, so WARP could never
#                    apply it. The clientinfo injector already zeroes those strings.
#   MsgStrings       the langtype gate it patches does not exist on this client. Tested at
#                    <langtype>0</langtype> - the login screen stayed fully English.
#   QuestDisplay     the string questID2display.txt does not occur anywhere in this client. Quest
#                    text comes from the SystemEN lua files handled below.
#   CancelToLogin    needs RestoreLoginWindow, which is mutually exclusive with UseOldLogin below,
#                    so it can never apply - and the client already returns to the login window
#                    from character select on its own.
#
# NoPassEncr is KEPT and is not optional if you use langtype 4 or 7: with it removed, login at
# langtype 4 fails outright. It does nothing at langtype 0 or 1.
#
# Verified: 37 patches requested, 37 applied.

from: "Inputs/2025-07-16_Ragexe_unpacked.exe"
to: "Outputs/patched.exe"

inputs:
    $newTownInfo:
        data: '53797374656d454e2f546f776e696e666f2e6c756200'
        display: "SystemEN/Towninfo.lub"
        type: 10

    $newItemInfo:
        data: '53797374656d454e2f6974656d696e666f2e6c756100'
        display: "SystemEN/iteminfo.lua"
        type: 10

    $dataINI:
        data: '444154412e494e4900'
        display: "DATA.INI"
        type: 10

    $newQuestQuali:
        data: '53797374656d454e2f5175657374436c617373696669636174696f6e496e666f2e6c756200'
        display: "SystemEN/QuestClassificationInfo.lub"
        type: 10

    $newspopup:
        data: '53797374656d454e2f73706f7075702e6c756200'
        display: "SystemEN/spopup.lub"
        type: 10

    $translationFile:
        data: ''
        display: "Inputs/Translations_EN.yml"
        type: 10

    $newTipBox:
        data: '53797374656d454e2f746970626f782e6c756200'
        display: "SystemEN/tipbox.lub"
        type: 10

    $newRcmdQInfoList:
        data: '53797374656d454e2f5265636f6d6d656e64656451756573747300'
        display: "SystemEN/RecommendedQuests"
        type: 10

    $newOngQInfoList:
        data: '53797374656d454e2f4f6e676f696e6751756573747300'
        display: "SystemEN/OngoingQuests"
        type: 10

    $newAchieveList:
        data: '53797374656d454e2f616368696576656d656e74732e6c756200'
        display: "SystemEN/achievements.lub"
        type: 10

    $newMapInfo:
        data: '53797374656d454e2f6d6170496e666f2e6c756200'
        display: "SystemEN/mapInfo.lub"
        type: 10

patches:
    # Client
    - EnableWho
    - EnableShowName
    - MediumCamAngle
    - UseOldLogin
    # Data
    - AlwaysAscii
    - CallKoreaClientInfo
    - DataFolderFirst
    - PlainTextDesc
    - LoadKrExtSettings
    - HideBuildInfo
    - FixArrowsCharset
    - TranslateClient
    - NoGGuard
    - CustomItemInfoLub
    - CustomAchieveLub
    - CustomTownInfoLub
    - CustomTipboxLub
    - CustomMapInfoLub
    - CustomOngQuestInfoLub
    - CustomRcmdQuestInfoLub
    - CustomspopupLub
    - CustomQuestQualiLub
    - GRFsFromIni
    # Env
    - EnableSysMenu
    - No1and1Arg
    - RestoreIcon
    # Network
    - NoNagle
    - NoPassEncr
    # UI
    - OpenToServiceSelect
    - GuildBrackets
    - FixChatAt
    - NoHourly
    - NoHelpMsg
    - FixSkillbarReset
    - NoGravityAds
    - NoGravityLogo
    # Window
    - FixLatestNCWin
